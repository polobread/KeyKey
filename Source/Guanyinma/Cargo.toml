[package]
name = "guanyinma"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT AND BSD-3-Clause AND Unicode-3.0"
publish = false
description = "Shared Rust input core for chichi77 KeyKey (琦琦輸入法)"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
default = []
bundled-sqlite = ["rusqlite/bundled"]

[dependencies]
rusqlite = { version = "=0.38.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
panic = "unwind"
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
