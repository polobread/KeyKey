<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img" aria-labelledby="title desc">
  <title id="title">在 Mac 系統設定中加入琦琦輸入法</title>
  <desc id="desc">操作示意：先開系統設定的鍵盤，按文字輸入的編輯按鈕，再按加號，選繁體中文和琦琦輸入法，最後按加入。</desc>
  <rect width="960" height="490" rx="18" fill="#f3f5f8"/>
  <rect x="34" y="35" width="892" height="420" rx="16" fill="white" stroke="#c9d1d9" stroke-width="2"/>
  <rect x="34" y="35" width="892" height="48" rx="16" fill="#e9edf2"/>
  <rect x="34" y="68" width="892" height="15" fill="#e9edf2"/>
  <circle cx="60" cy="59" r="7" fill="#ff5f57"/>
  <circle cx="82" cy="59" r="7" fill="#febc2e"/>
  <circle cx="104" cy="59" r="7" fill="#28c840"/>
  <text x="420" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif" font-size="19" font-weight="700" fill="#24292f">系統設定 · 鍵盤</text>
  <rect x="34" y="83" width="190" height="372" fill="#f6f8fa"/>
  <text x="69" y="137" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif" font-size="21" font-weight="700" fill="#24292f">系統設定</text>
  <rect x="54" y="172" width="150" height="43" rx="9" fill="#dbeafe"/>
  <text x="83" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif" font-size="19" font-weight="700" fill="#0969da">① 鍵盤</text>
  <text x="253" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif" font-size="25" font-weight="700" fill="#24292f">文字輸入</text>
  <rect x="250" y="153" width="638" height="74" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="271" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif" font-size="20" fill="#24292f">輸入方式</text>
  <rect x="746" y="168" width="123" height="44" rx="10" fill="#0969da"/>
  <text x="759" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif" font-size="17" font-weight="700" fill="white">② 編輯…</text>
  <path d="M808 225v18h-216v21" fill="none" stroke="#0969da" stroke-width="3" stroke-dasharray="8 6"/>
  <rect x="250" y="268" width="638" height="163" rx="12" fill="white" stroke="#8c959f" stroke-width="2"/>
  <rect x="266" y="285" width="75" height="43" rx="10" fill="#dbeafe"/>
  <text x="274" y="313" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif" font-size="19" font-weight="700" fill="#0969da">③ ＋</text>
  <rect x="359" y="285" width="156" height="43" rx="10" fill="#dbeafe"/>
  <text x="372" y="313" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif" font-size="18" font-weight="700" fill="#0969da">④ 繁體中文</text>
  <path d="M528 306h41" fill="none" stroke="#8c959f" stroke-width="3" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8c959f"/></marker></defs>
  <rect x="580" y="285" width="183" height="43" rx="10" fill="#dbeafe"/>
  <text x="590" y="313" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif" font-size="18" font-weight="700" fill="#0969da">⑤ 琦琦輸入法</text>
  <rect x="768" y="370" width="103" height="43" rx="10" fill="#0969da"/>
  <text x="778" y="398" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif" font-size="18" font-weight="700" fill="white">⑥ 加入</text>
  <text x="270" y="389" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif" font-size="18" fill="#57606a">依序選擇左側語言、右側輸入法</text>
</svg>
