<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" role="img" aria-labelledby="title desc">
  <title id="title">Windows 琦琦輸入法安裝流程示意圖</title>
  <desc id="desc">依序從正式發布頁下載 Windows ZIP，完整解壓縮，執行 Install.cmd，最後以 Win 加 Space 選取琦琦輸入法。</desc>
  <rect width="1000" height="220" rx="20" fill="#f5f7fb"/>
  <text x="500" y="38" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#1f2a44">Windows 11 安裝與啟用順序</text>
  <g font-family="sans-serif" font-size="19" text-anchor="middle">
    <rect x="24" y="75" width="208" height="105" rx="15" fill="#e7eefb" stroke="#9bb5d8"/>
    <text x="128" y="118" fill="#1f2a44">正式發布頁</text>
    <text x="128" y="149" fill="#52617b" font-size="16">下載 windows-x64.zip</text>
    <rect x="272" y="75" width="208" height="105" rx="15" fill="#e7eefb" stroke="#9bb5d8"/>
    <text x="376" y="118" fill="#1f2a44">全部解壓縮</text>
    <text x="376" y="149" fill="#52617b" font-size="16">打開解壓縮後資料夾</text>
    <rect x="520" y="75" width="208" height="105" rx="15" fill="#e7eefb" stroke="#9bb5d8"/>
    <text x="624" y="118" fill="#1f2a44">執行 Install.cmd</text>
    <text x="624" y="149" fill="#52617b" font-size="16">同意管理員權限提示</text>
    <rect x="768" y="75" width="208" height="105" rx="15" fill="#e5f4ea" stroke="#93c9a0"/>
    <text x="872" y="118" fill="#1f2a44">Win + Space</text>
    <text x="872" y="149" fill="#52617b" font-size="16">選琦琦輸入法試打</text>
  </g>
  <g fill="#5575a6">
    <path d="M238 123h12v-7l14 12-14 12v-7h-12z"/>
    <path d="M486 123h12v-7l14 12-14 12v-7h-12z"/>
    <path d="M734 123h12v-7l14 12-14 12v-7h-12z"/>
  </g>
  <text x="500" y="205" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#68758d">操作示意圖；Windows 畫面可能因系統版本與語言設定而異</text>
</svg>
