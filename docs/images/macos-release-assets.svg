<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">在正式發布頁選擇 macOS 安裝包</title>
  <desc id="desc">操作示意：在 Assets 附件中選擇檔名含 macos-arm64.pkg.zip 的檔案，不要選檢查碼、Windows 或原始碼。</desc>
  <rect width="920" height="430" rx="18" fill="#f6f8fa"/>
  <rect x="36" y="28" width="848" height="374" rx="13" fill="white" stroke="#d0d7de" stroke-width="2"/>
  <rect x="36" y="28" width="848" height="50" rx="13" fill="#24292f"/>
  <rect x="36" y="62" width="848" height="16" fill="#24292f"/>
  <text x="62" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif" font-size="21" font-weight="700" fill="white">琦琦輸入法 · 正式發布頁</text>
  <text x="62" y="117" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif" font-size="23" font-weight="700" fill="#24292f">Assets  附件</text>
  <text x="62" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif" font-size="16" fill="#57606a">請看檔名中間的平台名稱與最後的副檔名</text>
  <rect x="57" y="170" width="806" height="62" rx="10" fill="#e8f5e9" stroke="#2da44e" stroke-width="3"/>
  <circle cx="87" cy="201" r="16" fill="#2da44e"/>
  <text x="82" y="208" font-family="sans-serif" font-size="20" font-weight="700" fill="white">✓</text>
  <text x="119" y="207" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif" font-size="20" font-weight="700" fill="#0969da">chichi77-KeyKey-1.2.8-macos-arm64.pkg.zip</text>
  <text x="66" y="271" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif" font-size="18" fill="#57606a">chichi77-KeyKey-1.2.8-macos-arm64.pkg.zip.sha256</text>
  <text x="66" y="311" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif" font-size="18" fill="#57606a">chichi77-KeyKey-1.2.8-windows-x64.zip</text>
  <text x="66" y="351" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif" font-size="18" fill="#57606a">Source code (zip)</text>
  <text x="600" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif" font-size="16" fill="#8c3a2b">這是檢查碼，不是安裝包</text>
  <text x="700" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif" font-size="16" fill="#8c3a2b">Windows 版</text>
  <text x="700" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif" font-size="16" fill="#8c3a2b">原始碼</text>
</svg>
