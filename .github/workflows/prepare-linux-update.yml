name: Prepare Linux Stable Update

on:
  workflow_run:
    workflows: [Linux CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Published stable Linux tag, e.g. vX.Y.Z; requires successful original release gates'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: prepare-linux-stable-update
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.repository == 'polobread/KeyKey' && github.ref == 'refs/heads/master' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'release' &&
        github.event.workflow_run.head_repository.full_name == 'polobread/KeyKey' &&
        startsWith(github.event.workflow_run.head_branch, 'v') &&
        !contains(github.event.workflow_run.head_branch, '-')))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      actions: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      # Run only reviewed master tooling; never execute release or PR code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false
      - name: Verify Linux publication and prepare shared Linux/FreeBSD notification
        id: candidate
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.event.workflow_run.head_branch }}
          TRIGGER_RUN: ${{ github.event.workflow_run.id }}
        run: |
          python3 .github/scripts/prepare-linux-update.py prepare \
            --tag "$RELEASE_TAG" --trigger-run "$TRIGGER_RUN" --directory "$RUNNER_TEMP/linux-update"
      - name: Keep verified public candidate and package evidence for review
        if: steps.candidate.outputs.needed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-stable-update-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/linux-update/proposal/
            ${{ runner.temp }}/linux-update/plan.json
          if-no-files-found: error
          retention-days: 7
      - name: Authenticate git pushes with the workflow token
        if: steps.candidate.outputs.needed == 'true'
        run: gh auth setup-git
      - name: Open Linux/FreeBSD feed PR for maintainer review
        if: steps.candidate.outputs.needed == 'true'
        run: python3 .github/scripts/prepare-linux-update.py open-pr --directory "$RUNNER_TEMP/linux-update"
