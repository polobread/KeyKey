name: Desktop Release Tools

on:
  push:
    branches: ['codex/beta*-update-feeds']
    paths: &tool-paths
      - 'update/**'
      - '.github/scripts/**'
      - '.github/workflows/**'
      - 'Installer/**'
      - 'Source/Loaders/Windows-TSF/Packaging/**'
      - 'Source/Loaders/Windows-TSF/*Windows*.ps1'
      - '!**/*.md'
      - '!**/README*'
      - '!**/LICENSE*'
      - '!**/docs/**'
      - '!update/stable/**'
      - '!update/beta/**'
  pull_request:
    paths: *tool-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-tools-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate all workflow expressions, job dependencies and reusable calls
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"
      - name: Test release validation and platform tools
        if: ${{ !cancelled() }}
        env:
          KEYKEY_TEST_OPENSSL: openssl
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Test signed metadata and channel isolation
        if: ${{ !cancelled() }}
        env:
          KEYKEY_TEST_OPENSSL: openssl
        run: python3 -m unittest discover -s update -p 'test_*.py' -v
      - name: Validate the committed update feeds
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/sync-update-feeds.py --check-only
