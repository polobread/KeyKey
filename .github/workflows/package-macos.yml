name: Package macOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      app_artifact: ${{ steps.metadata.outputs.app_artifact }}

    steps:
      - name: Check out selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve and verify version
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -nE '1s/^.* ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' README.md)
          if [[ -z "$version" ]]; then
            echo "README.md does not end its title with an x.y.z version." >&2
            exit 1
          fi

          plists=(
            Source/Loaders/OSX-IMK/Takao-Info.plist
            Source/PreferenceApplications/OSX/Info.plist
            Source/Utilities/PhraseEditor/OSX/Info.plist
            Source/Distributions/Takao/Installer-OSX-Help/Info.plist
          )
          for plist in "${plists[@]}"; do
            bundle_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")
            short_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")
            if [[ "$bundle_version" != "$version" || "$short_version" != "$version" ]]; then
              echo "$plist has version $bundle_version / $short_version; expected $version." >&2
              exit 1
            fi
          done

          short_sha=$(git rev-parse --short=12 HEAD)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "artifact_name=keykey-macos-$version-$short_sha" >> "$GITHUB_OUTPUT"
          echo "app_artifact=keykey-macos-app-$version-$short_sha" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Install build dependency
        shell: bash
        run: brew install openssl@3

      - name: Cook database
        shell: bash
        run: make -C Source/Distributions/Takao/DatabaseCooker

      - name: Build input method
        shell: bash
        run: |
          cd Source
          xcodebuild \
            -project Takao.xcodeproj \
            -target "Takao (Loader OSX-IMK)" \
            -configuration Release \
            -xcconfig Takao-macOS.xcconfig \
            build

      - name: Build unsigned installer package
        shell: bash
        run: |
          cd Installer
          ./build.sh

      - name: Stage artifact and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          output="artifacts/chichi77-KeyKey-$VERSION-macos-arm64.pkg.zip"
          cp Installer/chichi77KeyKey.pkg.zip "$output"
          (cd artifacts && shasum -a 256 "$(basename "$output")" > "$(basename "$output").sha256")

      - name: Upload packaged artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Archive the built app for the signing job
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p handoff
          ditto -c -k --sequesterRsrc --keepParent \
            "Source/build/Release/chichi77 KeyKey.app" handoff/app.zip

      - name: Upload the built app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.metadata.outputs.app_artifact }}
          path: handoff/app.zip
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: macos-15
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      NOTARY_PROFILE: chichi77

    steps:
      - name: Check out selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify the tag matches the version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Release tag must be v$VERSION, but received $GITHUB_REF_NAME." >&2
            exit 1
          fi

      - name: Download the built app
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.app_artifact }}
          path: ${{ runner.temp }}/handoff

      - name: Unpack the built app
        shell: bash
        run: ditto -x -k "$RUNNER_TEMP/handoff/app.zip" "$RUNNER_TEMP/app"

      - name: Import the signing certificates
        env:
          CERTIFICATES: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          CERTIFICATES_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          keychain_password=$(openssl rand -base64 24)

          security create-keychain -p "$keychain_password" "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN"

          printf '%s' "$CERTIFICATES" | base64 --decode > "$RUNNER_TEMP/certs.p12"
          security import "$RUNNER_TEMP/certs.p12" -k "$KEYCHAIN" -P "$CERTIFICATES_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          rm -f "$RUNNER_TEMP/certs.p12"

          # A .p12 exported from Keychain Access carries the leaf identities but
          # not the Apple intermediate that issued them, and codesign cannot
          # build a chain without it. Fetch it rather than relying on whatever
          # the runner image happens to have installed.
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDCA.cer" \
            https://www.apple.com/certificateauthority/DeveloperIDCA.cer
          security import "$RUNNER_TEMP/DeveloperIDCA.cer" -k "$KEYCHAIN"

          # Without this, codesign and productbuild prompt for keychain access
          # and the job hangs until it times out.
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$KEYCHAIN" > /dev/null

          security list-keychains -s "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"

      - name: Resolve the signing identities
        shell: bash
        run: |
          set -euo pipefail
          security find-certificate -c "Developer ID Certification Authority" "$KEYCHAIN" > /dev/null

          # Developer ID Installer is not a codesigning identity, so it is
          # absent from find-identity -p codesigning.
          application=$(security find-identity -p codesigning -v "$KEYCHAIN" \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          installer=$(security find-identity -v "$KEYCHAIN" \
            | awk -F'"' '/Developer ID Installer/ {print $2; exit}')
          if [[ -z "$application" || -z "$installer" ]]; then
            echo "The keychain is missing a Developer ID Application or Installer identity." >&2
            exit 1
          fi

          echo "DEVELOPER_ID_APPLICATION=$application" >> "$GITHUB_ENV"
          echo "DEVELOPER_ID_INSTALLER=$installer" >> "$GITHUB_ENV"

      - name: Store the notarisation credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --keychain "$KEYCHAIN"

      - name: Sign, package, and notarise
        shell: bash
        run: |
          set -euo pipefail
          cd Installer
          ./build.sh "$RUNNER_TEMP/app/chichi77 KeyKey.app"

      - name: Verify the notarised package
        shell: bash
        run: |
          set -euo pipefail
          xcrun stapler validate Installer/chichi77KeyKey.pkg
          spctl --assess --type install -vv Installer/chichi77KeyKey.pkg

      - name: Stage artifact and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          output="artifacts/chichi77-KeyKey-$VERSION-macos-arm64.pkg.zip"
          cp Installer/chichi77KeyKey.pkg.zip "$output"
          (cd artifacts && shasum -a 256 "$(basename "$output")" > "$(basename "$output").sha256")

      - name: Upload signed artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keykey-macos-signed-${{ env.VERSION }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Publish to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            "artifacts/chichi77-KeyKey-$VERSION-macos-arm64.pkg.zip"
            "artifacts/chichi77-KeyKey-$VERSION-macos-arm64.pkg.zip.sha256"
          )

          if release_query=$(gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" --json tagName 2>&1); then
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "${assets[@]}"
          elif grep -qiE 'release not found|HTTP 404' <<< "$release_query"; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "chichi77 KeyKey $VERSION" \
              --generate-notes "${assets[@]}"
          else
            echo "Could not query release $RELEASE_TAG: $release_query" >&2
            exit 1
          fi

      - name: Remove the signing keychain
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/certs.p12"
          if [[ -f "$RUNNER_TEMP/signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/signing.keychain-db"
          fi
