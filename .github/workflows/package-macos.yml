name: Package macOS

on:
  push:
    branches: ['codex/beta*-update-feeds']
    paths:
      - 'Source/Loaders/OSX-IMK/**'
      - 'Source/PreferenceApplications/OSX/**'
      - 'Source/Utilities/PhraseEditor/**'
      - 'Source/Frameworks/**'
      - 'Source/ModulePackages/**'
      - 'Source/Shared/**'
      - 'Source/DataTables/**'
      - 'Source/Takao.xcodeproj/**'
      - 'Source/Takao*.xcconfig'
      - 'Installer/**'
      - 'update/*.py'
      - 'update/config.json'
      - 'update/dependencies.json'
      - 'update/test-macos.sh'
      - '.github/scripts/release-assets.py'
      - '.github/scripts/prepare-macos-test-fonts.*'
      - '.github/scripts/prepare-macos-update.py'
      - '.github/scripts/test_prepare_macos_update.py'
      - '.github/scripts/sync-update-feeds.py'
      - '.github/workflows/package-macos.yml'
      - 'Source/Guanyinma/**'
      - 'Source/Distributions/Takao/CookedDatabase/KeyKey.db'
      - 'Source/Distributions/Takao/OnlineData/CannedMessages.plist'
      - 'Source/Distributions/Takao/Installer-OSX-Help/**'
      - 'Source/Distributions/Takao/DatabaseCooker/Makefile'
      - 'Source/Distributions/Takao/DatabaseCooker/verify-smart-mandarin-db.py'
      - 'Source/Distributions/Takao/DatabaseCooker/smart_mandarin_model.py'
      - 'Source/Distributions/Takao/DatabaseCooker/cin_reading_frequencies.py'
      - 'Source/Distributions/Takao/DatabaseCooker/phrase_unigram_supplement.py'
      - 'Source/Loaders/iOS-Keyboard/KeyKeyEngine/Sources/KeyKeyEngine/KeyboardInput.swift'
      - 'Source/Loaders/Windows-TSF/SymbolEmojiSupplement.json'
      - '!**/*.md'
      - '!**/README*'
      - '!**/LICENSE*'
      - '!**/docs/**'
      - '.gitattributes'
  pull_request:
    paths:
      - 'Source/Loaders/OSX-IMK/**'
      - 'Source/PreferenceApplications/OSX/**'
      - 'Source/Utilities/PhraseEditor/**'
      - 'Source/Frameworks/**'
      - 'Source/ModulePackages/**'
      - 'Source/Shared/**'
      - 'Source/DataTables/**'
      - 'Source/Takao.xcodeproj/**'
      - 'Source/Takao*.xcconfig'
      - 'Installer/**'
      - 'update/*.py'
      - 'update/config.json'
      - 'update/dependencies.json'
      - 'update/test-macos.sh'
      - '.github/scripts/release-assets.py'
      - '.github/scripts/prepare-macos-test-fonts.*'
      - '.github/scripts/prepare-macos-update.py'
      - '.github/scripts/test_prepare_macos_update.py'
      - '.github/scripts/sync-update-feeds.py'
      - '.github/workflows/package-macos.yml'
      - 'Source/Guanyinma/**'
      - 'Source/Distributions/Takao/CookedDatabase/KeyKey.db'
      - 'Source/Distributions/Takao/OnlineData/CannedMessages.plist'
      - 'Source/Distributions/Takao/Installer-OSX-Help/**'
      - 'Source/Distributions/Takao/DatabaseCooker/Makefile'
      - 'Source/Distributions/Takao/DatabaseCooker/verify-smart-mandarin-db.py'
      - 'Source/Distributions/Takao/DatabaseCooker/smart_mandarin_model.py'
      - 'Source/Distributions/Takao/DatabaseCooker/cin_reading_frequencies.py'
      - 'Source/Distributions/Takao/DatabaseCooker/phrase_unigram_supplement.py'
      - 'Source/Loaders/iOS-Keyboard/KeyKeyEngine/Sources/KeyKeyEngine/KeyboardInput.swift'
      - 'Source/Loaders/Windows-TSF/SymbolEmojiSupplement.json'
      - '!**/*.md'
      - '!**/README*'
      - '!**/LICENSE*'
      - '!**/docs/**'
      - '.gitattributes'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      checks:
        description: 'package = all checks and unsigned package; tests = native checks only'
        type: choice
        options: [package, tests]
        default: package
      release_tag:
        description: 'Published macOS tag: vX.Y.Z or vX.Y.Z-betaN; blank = artifact only. Build uses the selected ref.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: package-macos-${{ inputs.release_tag || github.event.release.tag_name || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 75
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      app_artifact: ${{ steps.metadata.outputs.app_artifact }}
      publish_release: ${{ steps.metadata.outputs.publish_release }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      source_sha: ${{ steps.metadata.outputs.source_sha }}
      tag_sha: ${{ steps.metadata.outputs.tag_sha }}

    steps:
      - name: Check out selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve and verify version
        id: metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Source/Loaders/OSX-IMK/Takao-Info.plist)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The macOS app does not declare an x.y.z version." >&2
            exit 1
          fi

          plists=(
            Source/Loaders/OSX-IMK/Takao-Info.plist
            Source/PreferenceApplications/OSX/Info.plist
            Source/Utilities/PhraseEditor/OSX/Info.plist
            Source/Distributions/Takao/Installer-OSX-Help/Info.plist
          )
          for plist in "${plists[@]}"; do
            bundle_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")
            short_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")
            if [[ "$bundle_version" != "$version" || "$short_version" != "$version" ]]; then
              echo "$plist has version $bundle_version / $short_version; expected $version." >&2
              exit 1
            fi
          done

          python3 .github/scripts/release-assets.py resolve --version "$version"
          python3 update/prepare.py select-release \
            --tag "${REQUESTED_RELEASE_TAG:-$EVENT_RELEASE_TAG}" --version "$version" \
            --out "$RUNNER_TEMP/keykey-update-config.json"
          echo "KEYKEY_UPDATE_CONFIG=$RUNNER_TEMP/keykey-update-config.json" >> "$GITHUB_ENV"
          short_sha=$(git rev-parse --short=12 HEAD)
          {
            echo "version=$version"
            echo "artifact_name=keykey-macos-$version-$short_sha"
            echo "app_artifact=keykey-macos-app-$version-$short_sha"
          } >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Prepare native Apple CJK font without interactive download
        run: bash .github/scripts/prepare-macos-test-fonts.sh STHeiti LiHeiPro

      - name: Install build dependency
        shell: bash
        run: brew install openssl@3

      - name: Read the pinned Rust toolchain
        id: rust
        shell: bash
        run: python3 Source/Guanyinma/tools/ci/configure.py toolchain --platform macos

      - name: Prepare Rust for the input method
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pinned
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          targets: aarch64-apple-darwin

      - name: Verify shared database
        shell: bash
        run: make -C Source/Distributions/Takao/DatabaseCooker

      - name: Test native Guanyinma frontend integration without installation
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          sdk="$(xcrun --sdk macosx --show-sdk-path)"
          SQLITE3_LIB_DIR="$sdk/usr/lib" SQLITE3_INCLUDE_DIR="$sdk/usr/include" \
            SQLITE3_STATIC=0 SQLITE3_NO_PKG_CONFIG=1 \
            python3 Source/Loaders/OSX-IMK/Tests/run-guanyinma-tests.py --suite integration

      # Each isolated suite still runs after a different suite fails. A failed
      # step keeps the job failed and prevents unsigned/signing handoff.
      - name: Test symbol startup ordering and native views without installation
        if: ${{ !cancelled() }}
        run: python3 Source/Loaders/OSX-IMK/Tests/run-symbol-controller-tests.py

      - name: Test Shift and independent input modes without installation
        if: ${{ !cancelled() }}
        run: python3 Source/Loaders/OSX-IMK/Tests/run-input-mode-tests.py

      - name: Test general settings defaults, persistence and localized layout
        if: ${{ !cancelled() }}
        run: python3 Source/Loaders/OSX-IMK/Tests/run-general-input-mode-tests.py

      - name: Prepare native updater SDK
        if: ${{ !cancelled() }}
        run: python3 update/prepare.py fetch macos

      - name: Test updater and native Sparkle beta version ordering without installation
        if: ${{ !cancelled() }}
        run: bash update/test-macos.sh

      # Desktop Release Tools previously ran with repository defaults, before
      # the package job selected its channel configuration. Keep both contexts.
      - name: Test updater with the repository default channel environment
        if: ${{ !cancelled() }}
        run: env -u KEYKEY_UPDATE_CONFIG bash update/test-macos.sh

      - name: Test native signing with the repository default channel environment
        if: ${{ !cancelled() }}
        run: env -u KEYKEY_UPDATE_CONFIG python3 -m unittest discover -s update -p 'test_macos_signing.py' -v

      - name: Test native notarization with the repository default channel environment
        if: ${{ !cancelled() }}
        run: env -u KEYKEY_UPDATE_CONFIG python3 -m unittest discover -s update -p 'test_macos_notarization.py' -v

      - name: Test installer input source handling without installation
        if: ${{ !cancelled() }}
        run: bash Installer/test-input-sources.sh

      - name: Test macOS release metadata
        if: ${{ !cancelled() }}
        run: |
          KEYKEY_TEST_OPENSSL="$(brew --prefix openssl@3)/bin/openssl" \
            python3 -m unittest discover -s update -p test_macos_release.py -v

      - name: Test native ad-hoc signing without Apple submission
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s update -p 'test_macos_signing.py' -v

      - name: Test native notarization status gates without Apple submission
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s update -p 'test_macos_notarization.py' -v

      - name: Test stable update preparation with native OpenSSL
        if: ${{ !cancelled() }}
        run: |
          KEYKEY_TEST_OPENSSL="$(brew --prefix openssl@3)/bin/openssl" \
            python3 -m unittest discover -s .github/scripts -p test_prepare_macos_update.py -v

      - name: Build input method
        if: ${{ success() && inputs.checks != 'tests' && github.event_name != 'push' }}
        shell: bash
        run: |
          cd Source
          xcodebuild \
            -project Takao.xcodeproj \
            -target "Takao (Loader OSX-IMK)" \
            -configuration Release \
            -xcconfig Takao-macOS.xcconfig \
            build
          cd ..
          python3 update/prepare.py stamp-macos "Source/build/Release/chichi77 KeyKey.app"

      - name: Verify packaged language model
        if: ${{ success() && inputs.checks != 'tests' && github.event_name != 'push' }}
        shell: bash
        run: >-
          python3 Source/Distributions/Takao/DatabaseCooker/verify-smart-mandarin-db.py
          "Source/build/Release/chichi77 KeyKey.app/Contents/Resources/Databases/KeyKey.db"

      - name: Verify Guanyinma runtime notices are packaged
        if: ${{ success() && inputs.checks != 'tests' && github.event_name != 'push' }}
        shell: bash
        run: test -s "Source/build/Release/chichi77 KeyKey.app/Contents/Resources/GuanyinmaNotices.txt"

      - name: Build unsigned installer package
        if: ${{ success() && inputs.checks != 'tests' && github.event_name != 'push' }}
        shell: bash
        run: |
          cd Installer
          ./build.sh

      - name: Stage artifact and checksum
        if: ${{ success() && inputs.checks != 'tests' && github.event_name != 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          output="artifacts/chichi77-KeyKey-$VERSION-macos-arm64.pkg.zip"
          cp Installer/chichi77KeyKey.pkg.zip "$output"
          (cd artifacts && shasum -a 256 "$(basename "$output")" > "$(basename "$output").sha256")

      - name: Upload packaged artifact
        if: ${{ success() && inputs.checks != 'tests' && github.event_name != 'push' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Archive the built app for the signing job
        if: ${{ success() && inputs.checks != 'tests' && github.event_name != 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p handoff
          ditto -c -k --sequesterRsrc --keepParent \
            "Source/build/Release/chichi77 KeyKey.app" handoff/app.zip

      - name: Upload the built app
        if: ${{ success() && inputs.checks != 'tests' && github.event_name != 'push' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.metadata.outputs.app_artifact }}
          path: handoff/app.zip
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.event_name != 'push' && inputs.checks != 'tests' && needs.build.outputs.publish_release == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      NOTARY_PROFILE: chichi77
      RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
      BUILD_SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
      RELEASE_TAG_SHA: ${{ needs.build.outputs.tag_sha }}

    steps:
      - name: Check out selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.source_sha }}

      - name: Download the built app
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.app_artifact }}
          path: ${{ runner.temp }}/handoff

      - name: Unpack the built app
        shell: bash
        run: ditto -x -k "$RUNNER_TEMP/handoff/app.zip" "$RUNNER_TEMP/app"

      - name: Import the signing certificates
        env:
          CERTIFICATES: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          CERTIFICATES_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          keychain_password=$(openssl rand -base64 24)

          security create-keychain -p "$keychain_password" "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN"

          printf '%s' "$CERTIFICATES" | base64 --decode > "$RUNNER_TEMP/certs.p12"
          security import "$RUNNER_TEMP/certs.p12" -k "$KEYCHAIN" -P "$CERTIFICATES_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          rm -f "$RUNNER_TEMP/certs.p12"

          # A .p12 exported from Keychain Access carries the leaf identities but
          # not the Apple intermediate that issued them, and codesign cannot
          # build a chain without it. Fetch it rather than relying on whatever
          # the runner image happens to have installed.
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDCA.cer" \
            https://www.apple.com/certificateauthority/DeveloperIDCA.cer
          security import "$RUNNER_TEMP/DeveloperIDCA.cer" -k "$KEYCHAIN"

          # Without this, codesign and productbuild prompt for keychain access
          # and the job hangs until it times out.
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$KEYCHAIN" > /dev/null

          security list-keychains -s "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"

      - name: Resolve the signing identities
        shell: bash
        run: |
          set -euo pipefail
          security find-certificate -c "Developer ID Certification Authority" "$KEYCHAIN" > /dev/null

          # Developer ID Installer is not a codesigning identity, so it is
          # absent from find-identity -p codesigning.
          application=$(security find-identity -p codesigning -v "$KEYCHAIN" \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          installer=$(security find-identity -v "$KEYCHAIN" \
            | awk -F'"' '/Developer ID Installer/ {print $2; exit}')
          if [[ -z "$application" || -z "$installer" ]]; then
            echo "The keychain is missing a Developer ID Application or Installer identity." >&2
            exit 1
          fi

          echo "DEVELOPER_ID_APPLICATION=$application" >> "$GITHUB_ENV"
          echo "DEVELOPER_ID_INSTALLER=$installer" >> "$GITHUB_ENV"

      - name: Store the notarisation credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --keychain "$KEYCHAIN"

      - name: Sign, package, and notarise
        env:
          NOTARY_LOG_DIR: ${{ runner.temp }}/keykey-notary
        shell: bash
        run: |
          set -euo pipefail
          cd Installer
          ./build.sh "$RUNNER_TEMP/app/chichi77 KeyKey.app"

      - name: Verify the notarised package
        shell: bash
        run: |
          set -euo pipefail
          xcrun stapler validate Installer/chichi77KeyKey.pkg
          spctl --assess --type install -vv Installer/chichi77KeyKey.pkg

      - name: Upload notarization diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keykey-macos-notary-${{ env.VERSION }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/keykey-notary/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stage artifact and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          output="artifacts/chichi77-KeyKey-$VERSION-macos-arm64.pkg.zip"
          cp Installer/chichi77KeyKey.pkg.zip "$output"
          (cd artifacts && shasum -a 256 "$(basename "$output")" > "$(basename "$output").sha256")

      - name: Upload signed artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keykey-macos-signed-${{ env.VERSION }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Prepare signed macOS beta updater candidate
        if: contains(needs.build.outputs.release_tag, '-beta') && vars.MACOS_UPDATE_METADATA_ENABLED == 'true' && needs.build.outputs.source_sha == needs.build.outputs.tag_sha
        env:
          UPDATE_KEY_PEM: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY_PEM }}
          UPDATE_MIRROR_BASE: ${{ vars.AWS_RELEASE_MIRROR_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          : "${UPDATE_KEY_PEM:?Configure the reviewed update signing key in the release environment}"
          brew install openssl@3
          umask 077
          update_key=$(mktemp "$RUNNER_TEMP/update-key.XXXXXX")
          trap 'rm -f "$update_key"' EXIT
          printf '%s' "$UPDATE_KEY_PEM" > "$update_key"
          asset_base="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download"
          if [[ -n "$UPDATE_MIRROR_BASE" ]]; then
            asset_base="${UPDATE_MIRROR_BASE%/}/keykey/releases/download"
          fi
          python3 update/macos_release.py --openssl "$(brew --prefix openssl@3)/bin/openssl" \
            --package "artifacts/chichi77-KeyKey-$VERSION-macos-arm64.pkg.zip" \
            --version "$VERSION" --tag "$RELEASE_TAG" \
            --source-sha "$BUILD_SOURCE_SHA" --tag-sha "$RELEASE_TAG_SHA" \
            --key "$update_key" --base-url "$asset_base" --out update/out/macos-release

      - name: Upload verified beta updater candidate for review
        if: contains(needs.build.outputs.release_tag, '-beta') && vars.MACOS_UPDATE_METADATA_ENABLED == 'true' && needs.build.outputs.source_sha == needs.build.outputs.tag_sha
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keykey-macos-updater-${{ env.VERSION }}
          path: update/out/macos-release/
          if-no-files-found: error
          retention-days: 7

      - name: Publish to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          python3 .github/scripts/release-assets.py publish
          --platform macos --version "$VERSION" --directory artifacts

      - name: Configure AWS credentials for the release mirror
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_MIRROR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_RELEASE_MIRROR_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Mirror the verified macOS assets to S3
        env:
          RELEASE_MIRROR_BUCKET: ${{ vars.AWS_RELEASE_MIRROR_BUCKET }}
          RELEASE_MIRROR_DISTRIBUTION_ID: ${{ vars.AWS_RELEASE_MIRROR_DISTRIBUTION_ID }}
          RELEASE_MIRROR_BASE_URL: ${{ vars.AWS_RELEASE_MIRROR_BASE_URL }}
        shell: bash
        run: >-
          python3 .github/scripts/release-assets.py mirror
          --platform macos --version "$VERSION" --directory artifacts

      - name: Remove the signing keychain
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/certs.p12"
          if [[ -f "$RUNNER_TEMP/signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/signing.keychain-db"
          fi
