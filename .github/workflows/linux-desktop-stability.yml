name: Linux desktop input stability

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Explicit input settings profile'
        type: choice
        options:
          - linux-nine-key
          - shared-eight-key
        default: linux-nine-key

permissions:
  contents: read

concurrency:
  group: linux-desktop-stability-${{ github.ref }}-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  desktop-stability:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install native and GUI test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binutils build-essential cmake curl dbus-x11 fcitx5 \
            fcitx5-frontend-gtk3 fcitx5-frontend-gtk4 fcitx5-frontend-qt6 \
            fonts-wqy-zenhei libcanberra-dev libfcitx5core-dev libjson-c-dev \
            libpango1.0-dev libgtk-3-dev libgtk-4-dev libsqlite3-dev libglib2.0-bin \
            ninja-build pkg-config python3 python3-gi gir1.2-gtk-3.0 qt6-base-dev \
            util-linux x11-utils x11-xserver-utils xdotool xvfb

      - name: Build the staged-addon test targets
        working-directory: Source/Loaders/Linux-IME
        env:
          DESKTOP_PROFILE: ${{ inputs.profile }}
        run: |
          source ci/prepare-guanyinma.sh
          cmake -S . -B out/build/desktop-stability -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_INSTALL_PREFIX=/usr \
            -DKEYKEY_BUILD_FCITX5=ON -DKEYKEY_BUILD_X11_E2E_HOST=ON \
            -DKEYKEY_ENABLE_DESKTOP_STABILITY_TESTS=ON \
            -DKEYKEY_DESKTOP_STABILITY_PROFILE="$DESKTOP_PROFILE"
          cmake --build out/build/desktop-stability --parallel 2

      - name: Run shared cases and 100 rounds per scenario in each host
        working-directory: Source/Loaders/Linux-IME
        run: |
          ctest --test-dir out/build/desktop-stability \
            -L 'desktop-(core|input|stability)' --parallel 3 --output-on-failure \
            --output-junit "$PWD/out/build/desktop-stability/desktop-results.xml"

      - name: Upload settings, input events, and CTest results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-desktop-stability-${{ inputs.profile }}-${{ github.sha }}
          path: |
            Source/Loaders/Linux-IME/out/build/desktop-stability/desktop-input
            Source/Loaders/Linux-IME/out/build/desktop-stability/desktop-results.xml
            Source/Loaders/Linux-IME/out/build/desktop-stability/Testing/Temporary
            !Source/Loaders/Linux-IME/out/build/desktop-stability/desktop-input/stage/**
          if-no-files-found: warn
          retention-days: 7
