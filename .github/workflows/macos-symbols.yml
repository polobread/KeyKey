name: macOS Symbol Table

on:
  pull_request:
    paths:
      - 'Source/Loaders/OSX-IMK/**'
      - 'Source/PreferenceApplications/OSX/**'
      - 'Source/Takao.xcodeproj/**'
      - 'Source/Loaders/Windows-TSF/**'
      - 'Source/Loaders/iOS-Keyboard/**'
      - 'Source/Frameworks/**'
      - 'Source/Distributions/**'
      - '.github/workflows/**'
      - '!**/*.md'
      - '!**/README*'
      - '!**/LICENSE*'
      - '!**/docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  symbol-startup:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test symbol startup ordering and native views without installation
        run: python3 Source/Loaders/OSX-IMK/Tests/run-symbol-controller-tests.py

  input-mode:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test Shift and independent input modes without installation
        run: python3 Source/Loaders/OSX-IMK/Tests/run-input-mode-tests.py
      - name: Test general settings defaults, persistence and localized layout
        run: python3 Source/Loaders/OSX-IMK/Tests/run-general-input-mode-tests.py
