name: Package iOS Simulator

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve and verify version
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -nE '1s/^.* ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' README.md)
          if [[ -z "$version" ]]; then
            echo "README.md does not end its title with an x.y.z version." >&2
            exit 1
          fi

          configured_versions=$(sed -nE 's/^[[:space:]]*MARKETING_VERSION = ([^;]+);/\1/p' \
            Source/Loaders/iOS-Keyboard/KeyKeyiOS.xcodeproj/project.pbxproj | sort -u)
          if [[ "$configured_versions" != "$version" ]]; then
            echo "The iOS project has MARKETING_VERSION values '$configured_versions'; expected $version." >&2
            exit 1
          fi

          short_sha=$(git rev-parse --short=12 HEAD)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "artifact_name=keykey-ios-simulator-$version-$short_sha" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Select Xcode 16.4
        shell: bash
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Cook database
        shell: bash
        run: make -C Source/Distributions/Takao/DatabaseCooker

      - name: Test iOS engine
        working-directory: Source/Loaders/iOS-Keyboard/KeyKeyEngine
        shell: bash
        run: swift test

      - name: Build unsigned Simulator app
        working-directory: Source/Loaders/iOS-Keyboard
        shell: bash
        run: |
          xcodebuild \
            -project KeyKeyiOS.xcodeproj \
            -scheme "chichi77 KeyKey" \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/KeyKeyDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Stage and verify artifact
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/KeyKeyDerivedData/Build/Products/Release-iphonesimulator/chichi77 KeyKey.app"
          extension="$app/PlugIns/Keyboard.appex"
          database="$extension/KeyKey.db"
          [[ -d "$app" ]]
          [[ -d "$extension" ]]
          [[ -f "$database" ]]

          built_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")
          if [[ "$built_version" != "$VERSION" ]]; then
            echo "Built iOS app has version $built_version; expected $VERSION." >&2
            exit 1
          fi

          mkdir -p artifacts
          output="artifacts/chichi77-KeyKey-$VERSION-ios-simulator.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$output"
          (cd artifacts && shasum -a 256 "$(basename "$output")" > "$(basename "$output").sha256")

      - name: Upload packaged artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
