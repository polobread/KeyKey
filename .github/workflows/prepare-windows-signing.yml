name: Prepare Windows Signing Inputs

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Windows tag: vX.Y.Z or vX.Y.Z-betaN; choose the same tag as the workflow ref. Blank = test inputs only.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: package-windows-${{ inputs.release_tag || github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  package:
    # Default to Certum. One selector keeps the unsigned fallback mutually exclusive.
    if: vars.WINDOWS_RELEASE_MODE == '' || vars.WINDOWS_RELEASE_MODE == 'certum'
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve and verify version
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $cmake = Get-Content -LiteralPath Source/Loaders/Windows-TSF/CMakeLists.txt -Raw -Encoding UTF8
          if ($cmake -notmatch 'project\(KeyKeyWindowsTsf VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES C CXX\)') {
              throw 'CMakeLists.txt does not declare a Windows x.y.z project version.'
          }
          $version = $Matches[1]
          $packager = Get-Content -LiteralPath Source/Loaders/Windows-TSF/Package-Windows.ps1 -Raw -Encoding UTF8
          if ($packager -notmatch "\[string\] \`$Version = '$([regex]::Escape($version))'") {
              throw "Package-Windows.ps1 does not default to version $version."
          }

          $requestedTag = if ($env:REQUESTED_RELEASE_TAG) { $env:REQUESTED_RELEASE_TAG } else { $env:EVENT_RELEASE_TAG }
          if ($requestedTag) {
            git fetch --no-tags --depth=1 origin "refs/tags/$requestedTag"
            if ($LASTEXITCODE -ne 0) { throw 'Tag fetch failed.' }
            if ((git rev-parse HEAD) -ne (git rev-parse 'FETCH_HEAD^{commit}')) {
              throw 'Select the release tag as the workflow ref; recovery builds cannot be signed.'
            }
          }
          python .github/scripts/release-assets.py resolve --version $version
          if ($LASTEXITCODE -ne 0) { throw 'Release validation failed.' }
          $tag = if ($env:REQUESTED_RELEASE_TAG) { $env:REQUESTED_RELEASE_TAG } else { $env:EVENT_RELEASE_TAG }
          $config = Join-Path $env:RUNNER_TEMP 'keykey-update-config.json'
          python update/prepare.py select-release --tag "$tag" --version $version --out $config
          if ($LASTEXITCODE -ne 0) { throw 'Release update configuration failed.' }
          "KEYKEY_UPDATE_CONFIG=$config" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Ruby for Smart Mandarin database
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Set up .NET for settings
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Configure and build x64
        working-directory: Source/Loaders/Windows-TSF
        run: |
          python ../../../update/prepare.py fetch windows
          cmake --preset windows-x64-vs2026
          cmake --build --preset windows-x64-vs2026-release

      - name: Test x64
        working-directory: Source/Loaders/Windows-TSF
        # Managed settings/deployment cases run once in the dedicated step below.
        run: ctest --test-dir .\out\build\x64-vs2026 -C Release --output-on-failure -E '^(KeyKeyDeploymentTransactions|KeyKeySettingsPreferences)$'

      - name: Configure and build x86
        working-directory: Source/Loaders/Windows-TSF
        run: |
          cmake --preset windows-x86
          cmake --build --preset windows-x86-release

      - name: Test x86
        working-directory: Source/Loaders/Windows-TSF
        run: ctest --test-dir .\out\build\x86 -C Release --output-on-failure -E '^(KeyKeyDeploymentTransactions|KeyKeySettingsPreferences)$'

      - name: Test default-off diagnostic settings and deployment
        working-directory: Source/Loaders/Windows-TSF
        run: |
          dotnet run --project SettingsModern.Tests/SettingsModern.Tests.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic settings regression failed.' }
          dotnet run --project Deployment.Tests/Deployment.Tests.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Deployment regression failed.' }

      - name: Test shared data across x64, x86 and settings processes
        working-directory: Source/Loaders/Windows-TSF
        run: |
          $x64 = (Resolve-Path './out/build/x64-vs2026/Release/KeyKeySharedDataProtectionTest.exe').Path
          $x86 = (Resolve-Path './out/build/x86/Release/KeyKeySharedDataProtectionTest.exe').Path
          & $x64 $x86
          if ($LASTEXITCODE -ne 0) { throw 'x64 to x86 data protection regression failed.' }
          & $x86 $x64
          if ($LASTEXITCODE -ne 0) { throw 'x86 to x64 data protection regression failed.' }
          $managed = (Resolve-Path './SettingsModern.Tests/bin/Release/net10.0/SettingsModern.Tests.dll').Path
          $dotnet = (Get-Command dotnet).Source
          foreach ($native in @($x64, $x86)) {
            & $native --managed $dotnet $managed
            if ($LASTEXITCODE -ne 0) { throw 'Native and managed settings writer regression failed.' }
          }

      - name: Test Windows updater lifecycle and native signatures
        working-directory: Source/Loaders/Windows-TSF
        run: |
          $openssl = Join-Path $env:ProgramFiles 'Git/usr/bin/openssl.exe'
          if (-not (Test-Path -LiteralPath $openssl -PathType Leaf)) {
            throw 'OpenSSL is required for the native updater signature regressions.'
          }
          $env:KEYKEY_TEST_OPENSSL = $openssl
          python -m unittest discover -s ../../../update -v
          if ($LASTEXITCODE -ne 0) { throw 'Update metadata and Windows signing policy regression failed.' }
          foreach ($architecture in @('x64', 'x86')) {
            dotnet run --project DesktopUpdater.Tests/DesktopUpdater.Tests.csproj `
              --configuration Release -r "win-$architecture" --self-contained `
              -- --native --openssl $openssl
            if ($LASTEXITCODE -ne 0) { throw "Windows updater regression failed: $architecture" }
          }

      - name: Test signing artifact and local release gates
        run: |
          python -m unittest discover -s .github/scripts -p 'test_windows_signing.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows signing transport regressions failed.' }
          powershell.exe -NoProfile -File Source/Loaders/Windows-TSF/Packaging/Test-Signing.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows signing privacy regressions failed.' }

      - name: Stage unsigned inputs with source and file hashes
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.release_tag }}
          RELEASE_TAG_SHA: ${{ steps.metadata.outputs.tag_sha }}
        run: |
          python .github/scripts/windows-signing.py stage --directory signing-inputs `
            --x64 Source/Loaders/Windows-TSF/out/build/x64-vs2026 `
            --x86 Source/Loaders/Windows-TSF/out/build/x86 --tag "$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Signing input staging failed.' }

      - name: Upload inputs for local signing (no release publication)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keykey-windows-signing-${{ steps.metadata.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: signing-inputs/
          if-no-files-found: error
          retention-days: 30
