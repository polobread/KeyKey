name: Rebuild KeyKey database

# Generated DB/manifests/lists are excluded, so importing a build cannot loop.
on:
  pull_request:
    paths:
      - 'DataSource/**'
      - 'Source/Distributions/Takao/DatabaseCooker/**'
      - 'Source/DataTables/**'
      - '.github/workflows/rebuild-keykey-db.yml'
      - '.github/scripts/prepare-keykey-rebuild-pr.py'
      - '.github/scripts/test_prepare_keykey_rebuild_pr.py'
      - 'Source/Guanyinma/**'
      - '!Source/Guanyinma/**/*.md'
      - '!Source/Guanyinma/**/README*'
      - 'Source/Distributions/Takao/CookedDatabase/KeyKey.db'
      - '.gitattributes'
  pull_request_target:
    types: [closed]
    branches: [master]
    paths:
      - 'DataSource/chichi77Collection/phrase.*.tsv'
      - 'DataSource/AssociatedPhraseCollectionNames.tsv'
      - 'DataSource/AISyntheticBigram/common-unigram-supplement.tsv'
      - 'DataSource/CINReadingFrequency/cin-character-reading-frequencies.tsv'
      - 'DataSource/CINReadingFrequency/standalone-composition-review.tsv'
      - 'DataSource/CINReadingFrequency/standalone-composition-weights.json'
      - 'DataSource/CINReadingFrequency/build-cin-character-reading-frequencies.py'
      - 'DataSource/AISyntheticBigram/common-phrase-unigram.tsv'
      - 'DataSource/AISyntheticBigram/search-trend-unigram-source.txt'
      - 'DataSource/AISyntheticBigram/search-trend-reading-overrides.tsv'
      - 'DataSource/AISyntheticBigram/collection-unigram-overrides.tsv'
      - 'DataSource/McBopomofo/phrase.occ'
      - 'DataSource/McBopomofo/BPMFMappings.txt'
      - 'DataSource/AISyntheticBigram/supplemental-lexicon.tsv'
      - 'DataSource/AISyntheticBigram/numeric-unit-lexicon.tsv'
      - 'DataSource/AISyntheticBigram/basic-bigram-protected-characters.txt'
      - 'DataSource/AISyntheticArticles/typing-articles-v[234].jsonl'
      - 'DataSource/AISyntheticArticles/typing-articles-v5-seed/tw-corpus-*.md'
      - 'DataSource/AISyntheticArticles/verify-typing-articles-v5.py'
      - 'DataSource/AISyntheticBigram/benchmark-bigram-structure.py'
      - 'DataSource/AISyntheticBigram/typing_cost.py'
      - 'DataSource/AISyntheticBigram/typing_cost_filter.py'
      - 'Source/Guanyinma/src/**'
      - 'Source/Guanyinma/examples/typing-cost.rs'
      - 'Source/Guanyinma/Cargo.toml'
      - 'Source/Guanyinma/Cargo.lock'
      - 'Source/Guanyinma/build.rs'
      - 'Source/Guanyinma/rust-toolchain.toml'
      - 'Source/DataTables/bpmf-ext.cin'
      - 'Source/Distributions/Takao/DatabaseCooker/**'
      - 'DataSource/AISyntheticBigram/build-search-trend-unigram.py'
      - 'DataSource/AISyntheticBigram/build-versioned-article-corpus.py'
      - '.github/workflows/rebuild-keykey-db.yml'
      - '.github/scripts/prepare-keykey-rebuild-pr.py'
      - '.github/scripts/test_prepare_keykey_rebuild_pr.py'

permissions:
  contents: read

concurrency:
  group: rebuild-keykey-db-${{ github.event_name == 'pull_request' && github.ref || 'master' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/DataSource/AISyntheticBigram/.typing-cache/guanyinma
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare database verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends g++ libsqlite3-dev python3 ruby
      - name: Read the committed Rust toolchain
        id: toolchain
        run: python3 Source/Guanyinma/tools/ci/configure.py toolchain --platform linux
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pinned
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
      - name: Build Guanyinma regression typing engine
        working-directory: Source/Guanyinma
        run: |
          set -euo pipefail
          cargo build --locked --release --example typing-cost
          engine="$CARGO_TARGET_DIR/release/examples/typing-cost"
          test -x "$engine"
          echo "GUANYINMA_TYPING_ENGINE=$engine" >> "$GITHUB_ENV"

      - name: Test source tooling and verify the committed shared database
        run: |
          python3 -B -m unittest discover -s .github/scripts -p 'test_prepare_keykey_rebuild_pr.py' -v
          python3 -B -m unittest discover -s Source/Distributions/Takao/DatabaseCooker -p 'test_*.py' -v
          python3 -B -m unittest discover -s DataSource/AISyntheticBigram -p 'test_typing_cost*.py' -v
          python3 -B Source/Distributions/Takao/DatabaseCooker/verify-smart-mandarin-db.py Source/Distributions/Takao/CookedDatabase/KeyKey.db
          python3 -B Source/Distributions/Takao/DatabaseCooker/verify-shared-database-wiring.py

  rebuild:
    if: github.event_name == 'pull_request_target' && github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/DataSource/AISyntheticBigram/.typing-cache/guanyinma
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Only merged, trusted master code runs with the write token. Never
      # check out the PR head or execute unmerged fork code in this workflow.
      - name: Check out current master after the merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends g++ libsqlite3-dev python3 ruby

      - name: Read the committed Rust toolchain
        id: toolchain
        run: python3 Source/Guanyinma/tools/ci/configure.py toolchain --platform linux
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pinned
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
      - name: Build Guanyinma regression typing engine
        working-directory: Source/Guanyinma
        run: |
          set -euo pipefail
          cargo build --locked --release --example typing-cost
          engine="$CARGO_TARGET_DIR/release/examples/typing-cost"
          test -x "$engine"
          echo "GUANYINMA_TYPING_ENGINE=$engine" >> "$GITHUB_ENV"

      - name: Filter custom words and cook Unigram and Bigram
        run: |
          python3 -B -m unittest discover -s .github/scripts -p 'test_prepare_keykey_rebuild_pr.py' -v
          python3 -B -m unittest discover -s Source/Distributions/Takao/DatabaseCooker -p 'test_*.py' -v
          python3 -B -m unittest discover -s DataSource/AISyntheticBigram -p 'test_typing_cost*.py' -v
          python3 -B Source/Distributions/Takao/DatabaseCooker/rebuild-keykey-db.py \
            --output "$RUNNER_TEMP/keykey-rebuild" --jobs 2 --max-regression-actions 30 --apply
          python3 -B Source/Distributions/Takao/DatabaseCooker/verify-smart-mandarin-db.py \
            Source/Distributions/Takao/CookedDatabase/KeyKey.db
          python3 -B Source/Distributions/Takao/DatabaseCooker/verify-shared-database-wiring.py
          git diff --check

      - name: Publish substantive generated changes once for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B .github/scripts/prepare-keykey-rebuild-pr.py \
            --directory "$RUNNER_TEMP/keykey-rebuild"

      - name: Write build result to workflow summary
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'keykey-rebuild/build-report.json'
          if path.exists():
              report = json.loads(path.read_text())
              delta = report['regression']
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write(f"DB SHA-256: `{report['database_sha256']}`\n\n")
                  summary.write(f"{report['validation_articles']} articles: {delta['before']} → {delta['after']} actions ({delta['delta']:+d}).\n\n")
                  summary.write(report['reason'] + '\n\n')
                  summary.write(report['publication_reason'] + '\n\n')
                  summary.write('A new review PR is created only for substantive content without an existing review. No database artifact is uploaded.\n')
          PY
