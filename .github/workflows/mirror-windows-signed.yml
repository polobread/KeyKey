name: Mirror Signed Windows Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Published tag already approved by the local release script'
        required: true
        type: string
      build_run_id:
        description: 'Successful Prepare Windows Signing Inputs run used for signing'
        required: true
        type: string
      receipt_sha256:
        description: 'SHA-256 of the approved signed-build-info JSON'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: mirror-windows-signed-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/master'
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      RECEIPT_SHA256: ${{ inputs.receipt_sha256 }}
    steps:
      - name: Check out the reviewed release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
      - name: Verify provenance, release bytes, Authenticode, timestamp and product version
        shell: pwsh
        run: |
          python .github/scripts/windows-signing.py fetch-published --tag "$env:RELEASE_TAG" `
            --run-id "$env:BUILD_RUN_ID" --receipt-sha256 "$env:RECEIPT_SHA256" --directory Source/Loaders/Windows-TSF/out/mirror-assets
          if ($LASTEXITCODE -ne 0) { throw 'Signed Windows release verification failed.' }
      - name: Hand verified bytes to the protected mirror job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: Source/Loaders/Windows-TSF/out/mirror-assets/
          retention-days: 1
          if-no-files-found: error

  mirror:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      RECEIPT_SHA256: ${{ inputs.receipt_sha256 }}
      RELEASE_MIRROR_BUCKET: ${{ vars.AWS_RELEASE_MIRROR_BUCKET }}
      RELEASE_MIRROR_DISTRIBUTION_ID: ${{ vars.AWS_RELEASE_MIRROR_DISTRIBUTION_ID }}
      RELEASE_MIRROR_BASE_URL: ${{ vars.AWS_RELEASE_MIRROR_BASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: Source/Loaders/Windows-TSF/out/mirror-assets
      - name: Configure the existing release mirror role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_MIRROR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_RELEASE_MIRROR_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - name: Add immutable mirror objects and read back their hashes
        run: |
          python3 .github/scripts/windows-signing.py mirror --tag "$RELEASE_TAG" \
            --receipt-sha256 "$RECEIPT_SHA256" --directory Source/Loaders/Windows-TSF/out/mirror-assets
