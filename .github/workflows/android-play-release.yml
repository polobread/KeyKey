name: Android Play Release

on:
  pull_request:
    paths:
      - 'Source/Loaders/Android-IME/**'
      - 'Source/DataTables/**'
      - '.github/workflows/android-play-release.yml'
      - 'Source/Guanyinma/**'
      - 'Source/Distributions/Takao/CookedDatabase/KeyKey.db'
      - 'Source/Distributions/Takao/DatabaseCooker/Makefile'
      - 'Source/Distributions/Takao/DatabaseCooker/verify-smart-mandarin-db.py'
      - 'Source/Distributions/Takao/DatabaseCooker/smart_mandarin_model.py'
      - 'Source/Distributions/Takao/DatabaseCooker/cin_reading_frequencies.py'
      - 'Source/Distributions/Takao/DatabaseCooker/phrase_unigram_supplement.py'
      - '.gitattributes'
      - '!**/*.md'
      - '!**/README*'
      - '!**/docs/**'
  workflow_dispatch:
    inputs:
      operation:
        description: 'Publish the signed AAB to Google Play, or verify Debug APK and unsigned Release AAB only'
        type: choice
        options: [publish, verify]
        default: publish

permissions:
  contents: read

concurrency:
  group: android-play-release-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-release-bundle:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'verify')
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve build metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^val keyKeyVersionName = .*getOrElse\("([0-9]+\.[0-9]+\.[0-9]+)"\)$/\1/p' Source/Loaders/Android-IME/app/build.gradle.kts)
          if [[ -z "$version" ]]; then
            echo "Android app/build.gradle.kts does not declare an x.y.z default version." >&2
            exit 1
          fi

          IFS=. read -r major minor patch <<< "$version"
          major=$((10#$major))
          minor=$((10#$minor))
          patch=$((10#$patch))
          if (( major > 2100 || minor > 999 || patch > 999 )); then
            echo "Version $version cannot be converted safely to an Android versionCode." >&2
            exit 1
          fi
          version_code=$((major * 1000000 + minor * 1000 + patch))
          if (( version_code < 1 || version_code > 2100000000 )); then
            echo "Version $version produces an invalid Android versionCode." >&2
            exit 1
          fi
          short_sha=$(git rev-parse --short=12 HEAD)

          {
            echo "version=$version"
            echo "version_code=$version_code"
            echo "debug_artifact_name=keykey-android-$version-$short_sha-debug"
            echo "bundle_artifact_name=keykey-android-$version-$short_sha-release-bundle"
          } >> "$GITHUB_OUTPUT"
          {
            echo "VERSION=$version"
            echo "VERSION_CODE=$version_code"
          } >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Read the pinned Rust toolchain
        id: rust
        shell: bash
        run: python3 Source/Guanyinma/tools/ci/configure.py toolchain --platform android

      - name: Prepare Rust Android archives and host JNI toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pinned
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          components: rust-src
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Test mobile notice selection and attribution
        shell: bash
        run: |
          python3 Source/Guanyinma/tools/test_ios_runtime_notices.py
          python3 Source/Guanyinma/tools/test_android_runtime_notices.py

      - name: Ensure Android SDK packages are installed
        shell: bash
        run: >-
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-36.1" "build-tools;36.0.0"
          "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Verify the shared Smart Mandarin database
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential python3 ruby ruby-dev ruby-sqlite3 sqlite3
          make -C Source/Distributions/Takao/DatabaseCooker

      - name: Lint both variants, run JNI smoke once, and build APK and AAB
        working-directory: Source/Loaders/Android-IME
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon \
            lintDebug lintRelease testDebugUnitTest \
            --tests 'tw.chichi77.keykey.android.GuanyinmaNativeTest' \
            --tests 'tw.chichi77.keykey.android.GuanyinmaIntegrationTest' \
            --tests 'tw.chichi77.keykey.android.GuanyinmaUserDataTest' \
            --tests 'tw.chichi77.keykey.android.UserPhraseArchiveTest' \
            --tests 'tw.chichi77.keykey.android.LicenseNoticesTest' \
            assembleDebug bundleRelease \
            -PkeykeyVersionName="$VERSION" \
            -PkeykeyVersionCode="$VERSION_CODE"

      - name: Verify packaged runtime notices
        shell: bash
        run: |
          python3 Source/Guanyinma/tools/verify-android-runtime-notices.py \
            Source/Loaders/Android-IME/app/build/outputs/apk/debug/app-debug.apk
          python3 Source/Guanyinma/tools/verify-android-runtime-notices.py \
            Source/Loaders/Android-IME/app/build/outputs/bundle/release/app-release.aab

      - name: Verify headless JNI smoke executed
        shell: bash
        run: python3 Source/Loaders/Android-IME/tools/verify-guanyinma-smoke.py Source/Loaders/Android-IME/app/build/test-results/testDebugUnitTest

      - name: Stage and verify both packaged artifacts
        shell: bash
        run: |
          set -euo pipefail
          for kind in debug release-bundle; do
            source_package=Source/Loaders/Android-IME/app/build/outputs/apk/debug/app-debug.apk
            asset=assets/KeyKey.db
            suffix=android-debug.apk
            if [[ "$kind" == release-bundle ]]; then
              source_package=Source/Loaders/Android-IME/app/build/outputs/bundle/release/app-release.aab
              asset=base/assets/KeyKey.db
              suffix=android-unsigned.aab
            fi
            unzip -p "$source_package" "$asset" > "$RUNNER_TEMP/KeyKey-android-$kind.db"
            python3 Source/Distributions/Takao/DatabaseCooker/verify-smart-mandarin-db.py \
              "$RUNNER_TEMP/KeyKey-android-$kind.db"
            mkdir -p "artifacts/$kind"
            output="artifacts/$kind/chichi77-KeyKey-$VERSION-$suffix"
            cp "$source_package" "$output"

            if [[ "$kind" == debug ]]; then
              aapt_path="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt"
              "$aapt_path" dump badging "$output" |
                grep -F "versionCode='$VERSION_CODE' versionName='$VERSION'" >/dev/null
            fi
            (cd "artifacts/$kind" && sha256sum "$(basename "$output")" > "$(basename "$output").sha256")
          done

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.metadata.outputs.debug_artifact_name }}
          path: artifacts/debug/
          if-no-files-found: error
          retention-days: 7

      - name: Upload unsigned Release AAB artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.metadata.outputs.bundle_artifact_name }}
          path: artifacts/release-bundle/
          if-no-files-found: error
          retention-days: 7

  release-google-play:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: google-play-release

    steps:
      - name: Check out selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve and validate build metadata
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^val keyKeyVersionName = .*getOrElse\("([0-9]+\.[0-9]+\.[0-9]+)"\)$/\1/p' Source/Loaders/Android-IME/app/build.gradle.kts)
          if [[ -z "$version" ]]; then
            echo "Android app/build.gradle.kts does not declare an x.y.z default version." >&2
            exit 1
          fi

          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Release tag must be v$version, but received $GITHUB_REF_NAME." >&2
            exit 1
          fi

          IFS=. read -r major minor patch <<< "$version"
          major=$((10#$major))
          minor=$((10#$minor))
          patch=$((10#$patch))
          if (( major > 2100 || minor > 999 || patch > 999 )); then
            echo "Version $version cannot be converted safely to an Android versionCode." >&2
            exit 1
          fi
          version_code=$((major * 1000000 + minor * 1000 + patch))
          if (( version_code < 1 || version_code > 2100000000 )); then
            echo "Version $version produces an invalid Android versionCode." >&2
            exit 1
          fi

          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$version_code" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Read the pinned Rust toolchain
        id: rust
        shell: bash
        run: python3 Source/Guanyinma/tools/ci/configure.py toolchain --platform android

      - name: Prepare Rust Android archives and host JNI toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pinned
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          components: rust-src
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Test mobile notice selection and attribution
        shell: bash
        run: |
          python3 Source/Guanyinma/tools/test_ios_runtime_notices.py
          python3 Source/Guanyinma/tools/test_android_runtime_notices.py

      - name: Ensure Android SDK packages are installed
        shell: bash
        run: >-
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-36.1" "build-tools;36.0.0"
          "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Cook the Smart Mandarin database
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential python3 ruby ruby-dev ruby-sqlite3 sqlite3
          make -C Source/Distributions/Takao/DatabaseCooker

      - name: Restore upload key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Missing ANDROID_UPLOAD_KEYSTORE_BASE64}"
          : "${KEYSTORE_PASSWORD:?Missing ANDROID_UPLOAD_KEYSTORE_PASSWORD}"
          : "${KEY_ALIAS:?Missing ANDROID_UPLOAD_KEY_ALIAS}"
          : "${KEY_PASSWORD:?Missing ANDROID_UPLOAD_KEY_PASSWORD}"
          : "${SERVICE_ACCOUNT_JSON:?Missing GOOGLE_PLAY_SERVICE_ACCOUNT_JSON}"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/chichi-upload.jks"
          chmod 600 "$RUNNER_TEMP/chichi-upload.jks"

      - name: Lint, test, and build signed AAB
        working-directory: Source/Loaders/Android-IME
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/chichi-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --no-configuration-cache \
            lintRelease testDebugUnitTest \
            --tests 'tw.chichi77.keykey.android.GuanyinmaNativeTest' \
            --tests 'tw.chichi77.keykey.android.GuanyinmaIntegrationTest' \
            --tests 'tw.chichi77.keykey.android.GuanyinmaUserDataTest' \
            --tests 'tw.chichi77.keykey.android.UserPhraseArchiveTest' \
            --tests 'tw.chichi77.keykey.android.LicenseNoticesTest' \
            bundleRelease \
            -PkeykeyVersionName="$VERSION" \
            -PkeykeyVersionCode="$VERSION_CODE"

      - name: Verify packaged runtime notices
        shell: bash
        run: python3 Source/Guanyinma/tools/verify-android-runtime-notices.py Source/Loaders/Android-IME/app/build/outputs/bundle/release/app-release.aab

      - name: Verify headless JNI smoke executed
        shell: bash
        run: python3 Source/Loaders/Android-IME/tools/verify-guanyinma-smoke.py Source/Loaders/Android-IME/app/build/test-results/testDebugUnitTest

      - name: Verify signed AAB
        shell: bash
        run: |
          bundle=Source/Loaders/Android-IME/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify "$bundle"
          unzip -p "$bundle" base/assets/KeyKey.db > "$RUNNER_TEMP/KeyKey-android.db"
          python3 Source/Distributions/Takao/DatabaseCooker/verify-smart-mandarin-db.py \
            "$RUNNER_TEMP/KeyKey-android.db"

      - name: Upload to Google Play internal testing
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: tw.chichi77.keykey.android
          releaseFiles: Source/Loaders/Android-IME/app/build/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed

      - name: Remove temporary upload key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/chichi-upload.jks"
