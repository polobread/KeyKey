name: Linux CI

on:
  pull_request:
    paths:
      - 'Source/Loaders/Linux-IME/**'
      - 'Source/Guanyinma/**'
      - 'Source/Shared/**'
      - 'Source/Branding/**'
      - 'Source/DataTables/**'
      - 'Source/Distributions/**'
      - 'DataSource/**'
      - '.github/scripts/**'
      - '.github/workflows/**'
      - '!**/*.md'
      - '!**/README*'
      - '!**/LICENSE*'
      - '!**/docs/**'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing published release tag, e.g. vX.Y.Z or vX.Y.Z-betaN; blank = artifact only. Beta builds must use the exact tag commit.'
        required: false
        type: string
      existing_artifact_run:
        description: 'Mirror already-published Linux assets from this original release run; skip all builds'
        required: false
        type: string
      verification_sha256:
        description: 'Approved supplemental Linux verification report SHA-256 for existing-artifact mode'
        required: false
        type: string

env:
  KEYKEY_ENABLE_GUANYINMA: "ON"

permissions:
  contents: read

concurrency:
  group: linux-ci-${{ inputs.release_tag || github.event.release.tag_name || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pull-request-smoke:
    if: github.event_name == 'pull_request'
    name: Ubuntu 24.04 build, unit tests, and GTK3 typing smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install smoke-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binutils build-essential cmake dbus-x11 fcitx5 \
            fcitx5-frontend-gtk3 fonts-wqy-zenhei g++ libcanberra-dev \
            libfcitx5core-dev libjson-c-dev libpango1.0-dev curl libgtk-3-dev libgtk-4-dev libsqlite3-dev ninja-build \
            pkg-config python3 python3-gi gir1.2-gtk-3.0 qt6-base-dev x11-utils xdotool xvfb

      - name: Build, run unit tests, and verify staged installation
        working-directory: Source/Loaders/Linux-IME
        env:
          KEYKEY_BUILD_DIR: out/build/ubuntu-24.04-pr-smoke
          KEYKEY_STAGE_DIR: out/stage/ubuntu-24.04-pr-smoke
          KEYKEY_BUILD_X11_E2E_HOST: ON
        run: ci/build-and-test.sh

      - name: Type through both cores in isolated GTK/Qt X11 sessions
        working-directory: Source/Loaders/Linux-IME
        run: bash ci/run-dual-core-smoke.sh out/build/ubuntu-24.04-pr-smoke out/stage/ubuntu-24.04-pr-smoke

      - name: Upload PR smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-ubuntu-24.04-pr-smoke-${{ github.sha }}
          path: |
            Source/Loaders/Linux-IME/out/e2e/ubuntu-24.04-pr-smoke
            Source/Loaders/Linux-IME/out/build/ubuntu-24.04-pr-smoke/dual-core-smoke
          if-no-files-found: warn
          retention-days: 7

  ubuntu-24-04-fcitx5-build:
    if: github.event_name != 'pull_request' && !inputs.existing_artifact_run && !inputs.verification_sha256
    name: Full Ubuntu 24.04 build, packages, and GTK3/GTK4/Qt6 X11 E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      publish_release: ${{ steps.metadata.outputs.publish_release }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      source_sha: ${{ steps.metadata.outputs.source_sha }}
      tag_sha: ${{ steps.metadata.outputs.tag_sha }}

    steps:
      - name: Check out selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Beta retries keep the original source even when the workflow is run from master.
          ref: ${{ github.event_name == 'workflow_dispatch' && contains(inputs.release_tag, '-beta') && inputs.release_tag || github.sha }}

      - name: Resolve and verify release target
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^project\(KeyKeyLinux VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES.*$/\1/p' Source/Loaders/Linux-IME/CMakeLists.txt)
          test -n "$version"
          python3 .github/scripts/release-assets.py resolve --version "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            at-spi2-core binutils build-essential cmake dbus-x11 debhelper \
            dpkg-dev fakeroot fcitx5 fcitx5-config-qt \
            fcitx5-frontend-gtk3 fcitx5-frontend-gtk4 fcitx5-frontend-qt6 \
            fonts-wqy-zenhei g++ \
            libcanberra-dev libfcitx5core-dev libjson-c-dev libpango1.0-dev curl cargo libglib2.0-bin libgtk-3-dev libgtk-4-dev libsqlite3-dev \
            lintian netpbm ninja-build pkg-config python3-pyatspi qt6-base-dev \
            x11-apps \
            x11-utils xdotool xvfb

      - name: Build, test, and verify staged installation
        working-directory: Source/Loaders/Linux-IME
        env:
          KEYKEY_BUILD_DIR: out/build/ubuntu-24.04-ci
          KEYKEY_STAGE_DIR: out/stage/ubuntu-24.04-ci
          KEYKEY_BUILD_X11_E2E_HOST: ON
        run: ci/build-and-test.sh

      - name: Test configure and GNU Make source builds
        working-directory: Source/Loaders/Linux-IME
        run: ci/test-configure-make.sh --source-directory-only

      - name: Rebuild the source archive without Git or cached builds
        working-directory: Source/Loaders/Linux-IME
        run: ci/test-source-archive.sh

      - name: Test default source install with Fcitx X11 typing
        working-directory: Source/Loaders/Linux-IME
        run: sudo ci/test-configure-make-system-e2e.sh

      - name: Run engine tests with ASan and UBSan
        working-directory: Source/Loaders/Linux-IME
        run: |
          cmake --preset engine-sanitized
          cmake --build --preset engine-sanitized
          ctest --preset engine-sanitized

      - name: Build Ubuntu 24.04 Debian packages and upgrade fixture
        working-directory: Source/Loaders/Linux-IME
        run: |
          ci/build-debian-packages.sh ubuntu-24.04 upgrade-fixture
          ci/build-debian-packages.sh ubuntu-24.04 release-candidate

      - name: Test package install, upgrade, removal, reinstall, and X11 typing
        working-directory: Source/Loaders/Linux-IME
        env:
          KEYKEY_BUILD_DIR: out/build/ubuntu-24.04-ci
          KEYKEY_PACKAGE_ARTIFACT_DIR: out/e2e/ubuntu-24.04-package-ci
          KEYKEY_RUN_X11_E2E: ON
        run: |
          sudo --preserve-env=KEYKEY_BUILD_DIR,KEYKEY_PACKAGE_ARTIFACT_DIR,KEYKEY_RUN_X11_E2E \
            ci/test-debian-package-lifecycle.sh \
              out/packages/ubuntu-24.04-amd64/release-candidate \
              out/packages/ubuntu-24.04-amd64/upgrade-fixture

      - name: Restore runner read access to X11 evidence
        if: always()
        working-directory: Source/Loaders/Linux-IME
        run: |
          evidence=out/e2e/ubuntu-24.04-package-ci
          if [[ -d "$evidence" ]]; then
            sudo chown -R -- "$(id -u):$(id -g)" "$evidence"
            sudo chmod -R u+rX -- "$evidence"
          fi

      - name: Upload X11 typing evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-ubuntu-24.04-fcitx5-x11-e2e-${{ github.sha }}
          path: Source/Loaders/Linux-IME/out/e2e/ubuntu-24.04-package-ci
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Ubuntu 24.04 Debian packages
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-ubuntu-24.04-debian-packages-${{ github.sha }}
          path: Source/Loaders/Linux-IME/out/packages/ubuntu-24.04-amd64/release-candidate
          if-no-files-found: error
          retention-days: 7

  publish-linux:
    needs: [ubuntu-24-04-fcitx5-build, ubuntu-22-04-minimum-api]
    if: >-
      always() && !cancelled() && (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
         && (inputs.existing_artifact_run || inputs.verification_sha256))
        || (!inputs.existing_artifact_run && !inputs.verification_sha256
            && needs.ubuntu-24-04-fcitx5-build.result == 'success'
            && needs.ubuntu-22-04-minimum-api.result == 'success'
            && needs.ubuntu-24-04-fcitx5-build.outputs.publish_release == 'true'))
    name: Publish Ubuntu 24.04 packages to the GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ (inputs.existing_artifact_run || inputs.verification_sha256) && 20 || 10 }}
    environment: release
    permissions:
      actions: read
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ (inputs.existing_artifact_run || inputs.verification_sha256) && inputs.release_tag || needs.ubuntu-24-04-fcitx5-build.outputs.release_tag }}
      BUILD_SOURCE_SHA: ${{ needs.ubuntu-24-04-fcitx5-build.outputs.source_sha }}
      RELEASE_TAG_SHA: ${{ needs.ubuntu-24-04-fcitx5-build.outputs.tag_sha }}

    steps:
      - name: Check out selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Existing-artifact mode uses reviewed tools; the helper verifies the original tag source.
          ref: ${{ (inputs.existing_artifact_run || inputs.verification_sha256) && github.sha || needs.ubuntu-24-04-fcitx5-build.outputs.source_sha }}

      - name: Download verified Ubuntu 24.04 packages
        if: ${{ !inputs.existing_artifact_run && !inputs.verification_sha256 }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-ubuntu-24.04-debian-packages-${{ github.sha }}
          path: ${{ runner.temp }}/linux-packages

      - name: Verify version, package set, and checksums
        if: ${{ !inputs.existing_artifact_run && !inputs.verification_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^project\(KeyKeyLinux VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES.*$/\1/p' Source/Loaders/Linux-IME/CMakeLists.txt)
          if [[ -z "$version" ]]; then
            echo "Could not read the Linux package version from CMakeLists.txt." >&2
            exit 1
          fi
          python3 -c 'import sys; sys.path.insert(0, "update"); import channels; channels.release_version(sys.argv[1], sys.argv[2]) if sys.argv[1] else sys.exit("Release tag is required.")' "$RELEASE_TAG" "$version"

          cd "$RUNNER_TEMP/linux-packages"
          data="chichi77-keykey-data_${version}-1+ubuntu24.04_all.deb"
          fcitx="fcitx5-chichi77-keykey_${version}-1+ubuntu24.04_amd64.deb"
          shopt -s nullglob
          panels=(gnome-shell-extension-keykey-kimpanel_*+ubuntu24.04_all.deb)
          if (( ${#panels[@]} != 1 )); then
            echo "Expected exactly one Ubuntu 24.04 GNOME panel package." >&2
            exit 1
          fi
          panel=${panels[0]}
          panel_source="${panel%_all.deb}_source.tar.gz"
          for file in "$data" "$fcitx" "$panel" "$panel_source" SHA256SUMS; do
            test -s "$file" || { echo "Missing or empty release asset: $file" >&2; exit 1; }
          done
          expected_checksums=$(printf './%s\n' "$data" "$fcitx" "$panel" "$panel_source" | LC_ALL=C sort)
          actual_checksums=$(awk '{ print $2 }' SHA256SUMS | LC_ALL=C sort)
          if [[ "$actual_checksums" != "$expected_checksums" ]]; then
            echo "SHA256SUMS must list exactly the four Linux release assets." >&2
            exit 1
          fi
          sha256sum --check --strict SHA256SUMS

          mkdir -p "$RUNNER_TEMP/linux-release-assets"
          cp -- "$data" "$fcitx" "$panel" "$panel_source" SHA256SUMS \
            "$RUNNER_TEMP/linux-release-assets/"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Add Linux packages to the GitHub Release
        if: ${{ !inputs.existing_artifact_run && !inputs.verification_sha256 }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          python3 .github/scripts/release-assets.py publish
          --platform linux --version "$VERSION" --directory "$RUNNER_TEMP/linux-release-assets"

      - name: Configure AWS credentials for the release mirror
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_MIRROR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_RELEASE_MIRROR_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Mirror the verified Linux assets to S3
        if: ${{ !inputs.existing_artifact_run && !inputs.verification_sha256 }}
        env:
          RELEASE_MIRROR_BUCKET: ${{ vars.AWS_RELEASE_MIRROR_BUCKET }}
          RELEASE_MIRROR_DISTRIBUTION_ID: ${{ vars.AWS_RELEASE_MIRROR_DISTRIBUTION_ID }}
          RELEASE_MIRROR_BASE_URL: ${{ vars.AWS_RELEASE_MIRROR_BASE_URL }}
        shell: bash
        run: >-
          python3 .github/scripts/release-assets.py mirror
          --platform linux --version "$VERSION"
          --directory "$RUNNER_TEMP/linux-release-assets"

      - name: Mirror existing Linux artifact without building
        if: inputs.existing_artifact_run || inputs.verification_sha256
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN: ${{ inputs.existing_artifact_run }}
          VERIFICATION_SHA256: ${{ inputs.verification_sha256 }}
          RELEASE_MIRROR_BUCKET: ${{ vars.AWS_RELEASE_MIRROR_BUCKET }}
          RELEASE_MIRROR_DISTRIBUTION_ID: ${{ vars.AWS_RELEASE_MIRROR_DISTRIBUTION_ID }}
          RELEASE_MIRROR_BASE_URL: ${{ vars.AWS_RELEASE_MIRROR_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import sys; sys.path.insert(0, "update"); import channels; print(channels.parse_version(sys.argv[1].removeprefix("v"))[0])' "$RELEASE_TAG")
          python3 .github/scripts/release-assets.py mirror-existing-linux \
            --platform linux --version "$version" --directory "$RUNNER_TEMP/linux-existing" \
            --artifact-run "$ARTIFACT_RUN" --verification-sha256 "$VERIFICATION_SHA256"

  ubuntu-22-04-minimum-api:
    if: github.event_name != 'pull_request' && !inputs.existing_artifact_run && !inputs.verification_sha256
    name: Full Ubuntu 22.04 minimum API build and package lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: ubuntu:22.04@sha256:829f6df217bcbae2b371026e81711d1a787c61b2967ad09d015063663ebafbf7

    steps:
      - name: Install checkout prerequisites
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates git

      - name: Check out selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && contains(inputs.release_tag, '-beta') && inputs.release_tag || github.sha }}

      - name: Install minimum native build dependencies
        run: |
          apt-get install --yes --no-install-recommends \
            binutils build-essential cmake debhelper dpkg-dev fakeroot g++ \
            libcanberra-dev libfcitx5core-dev libjson-c-dev libpango1.0-dev curl cargo libsqlite3-dev lintian ninja-build pkg-config python3

      - name: Build, test, and verify staged installation
        working-directory: Source/Loaders/Linux-IME
        env:
          KEYKEY_BUILD_DIR: out/build/ubuntu-22.04-ci
          KEYKEY_STAGE_DIR: out/stage/ubuntu-22.04-ci
        run: ci/build-and-test.sh

      - name: Test configure and GNU Make source builds
        working-directory: Source/Loaders/Linux-IME
        run: ci/test-configure-make.sh --source-directory-only

      - name: Rebuild the source archive without Git or cached builds
        working-directory: Source/Loaders/Linux-IME
        run: ci/test-source-archive.sh

      - name: Build Ubuntu 22.04 Debian packages
        working-directory: Source/Loaders/Linux-IME
        run: ci/build-debian-packages.sh ubuntu-22.04 release-candidate

      - name: Test package install, removal, and reinstall
        working-directory: Source/Loaders/Linux-IME
        env:
          KEYKEY_PACKAGE_ARTIFACT_DIR: out/e2e/ubuntu-22.04-package-ci
        run: |
          ci/test-debian-package-lifecycle.sh \
            out/packages/ubuntu-22.04-amd64/release-candidate

      - name: Upload Ubuntu 22.04 package evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-ubuntu-22.04-debian-packages-${{ github.sha }}
          path: |
            Source/Loaders/Linux-IME/out/packages/ubuntu-22.04-amd64/release-candidate
            Source/Loaders/Linux-IME/out/e2e/ubuntu-22.04-package-ci
          if-no-files-found: warn
          retention-days: 7
