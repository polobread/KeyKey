name: Linux CI

on:
  pull_request:
    paths:
      - '.github/workflows/linux-ci.yml'
      - 'Source/Loaders/Linux-IME/**'
      - 'Source/DataTables/**'
      - 'DataSource/**'
      - 'LINUX_DEVELOPMENT_PLAN.md'
      - 'LINUX_TEST_PLAN.md'
  push:
    tags:
      - 'v*'
  # Manual runs validate packages and retain artifacts; the release environment
  # permits publication only from v* tag pushes.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  pull-request-smoke:
    if: github.event_name == 'pull_request'
    name: Ubuntu 24.04 build, unit tests, and GTK3 typing smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install smoke-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binutils build-essential cmake dbus-x11 fcitx5 \
            fcitx5-frontend-gtk3 fonts-wqy-zenhei g++ libcanberra-dev \
            libfcitx5core-dev libgtk-3-dev libgtk-4-dev libsqlite3-dev ninja-build \
            pkg-config python3 qt6-base-dev x11-utils xdotool xvfb

      - name: Build, run unit tests, and verify staged installation
        working-directory: Source/Loaders/Linux-IME
        env:
          KEYKEY_BUILD_DIR: out/build/ubuntu-24.04-pr-smoke
          KEYKEY_STAGE_DIR: out/stage/ubuntu-24.04-pr-smoke
          KEYKEY_BUILD_X11_E2E_HOST: ON
        run: ci/build-and-test.sh

      - name: Type one Standard Bopomofo candidate through Fcitx and GTK3
        working-directory: Source/Loaders/Linux-IME
        env:
          KEYKEY_BUILD_DIR: out/build/ubuntu-24.04-pr-smoke
          KEYKEY_STAGE_DIR: out/stage/ubuntu-24.04-pr-smoke
          KEYKEY_E2E_ARTIFACT_DIR: out/e2e/ubuntu-24.04-pr-smoke
          KEYKEY_E2E_CASES: T01-X11-GTK3-BOPOMOFO-STANDARD
          KEYKEY_E2E_CONFIG_UI: OFF
        run: |
          sudo --preserve-env=KEYKEY_BUILD_DIR,KEYKEY_STAGE_DIR,KEYKEY_E2E_ARTIFACT_DIR,KEYKEY_E2E_CASES,KEYKEY_E2E_CONFIG_UI \
            ci/run-x11-e2e.sh

      - name: Upload PR smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-ubuntu-24.04-pr-smoke-${{ github.sha }}
          path: Source/Loaders/Linux-IME/out/e2e/ubuntu-24.04-pr-smoke
          if-no-files-found: warn
          retention-days: 7

  ubuntu-24-04-fcitx5-build:
    if: github.event_name != 'pull_request'
    name: Full Ubuntu 24.04 build, packages, and GTK3/GTK4/Qt6 X11 E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            at-spi2-core binutils build-essential cmake dbus-x11 debhelper \
            dpkg-dev fakeroot fcitx5 fcitx5-config-qt \
            fcitx5-frontend-gtk3 fcitx5-frontend-gtk4 fcitx5-frontend-qt6 \
            fonts-wqy-zenhei g++ \
            libcanberra-dev libfcitx5core-dev libglib2.0-bin libgtk-3-dev libgtk-4-dev libsqlite3-dev \
            lintian netpbm ninja-build pkg-config python3-pyatspi qt6-base-dev \
            x11-apps \
            x11-utils xdotool xvfb

      - name: Build, test, and verify staged installation
        working-directory: Source/Loaders/Linux-IME
        env:
          KEYKEY_BUILD_DIR: out/build/ubuntu-24.04-ci
          KEYKEY_STAGE_DIR: out/stage/ubuntu-24.04-ci
          KEYKEY_BUILD_X11_E2E_HOST: ON
        run: ci/build-and-test.sh

      - name: Test configure and GNU Make source builds
        working-directory: Source/Loaders/Linux-IME
        run: ci/test-configure-make.sh --source-directory-only

      - name: Rebuild the source archive without Git or cached builds
        working-directory: Source/Loaders/Linux-IME
        run: ci/test-source-archive.sh

      - name: Test default source install with Fcitx X11 typing
        working-directory: Source/Loaders/Linux-IME
        run: sudo ci/test-configure-make-system-e2e.sh

      - name: Run engine tests with ASan and UBSan
        working-directory: Source/Loaders/Linux-IME
        run: |
          cmake --preset engine-sanitized
          cmake --build --preset engine-sanitized
          ctest --preset engine-sanitized

      - name: Build Ubuntu 24.04 Debian packages and upgrade fixture
        working-directory: Source/Loaders/Linux-IME
        run: |
          ci/build-debian-packages.sh ubuntu-24.04 upgrade-fixture
          ci/build-debian-packages.sh ubuntu-24.04 release-candidate

      - name: Test package install, upgrade, removal, reinstall, and X11 typing
        working-directory: Source/Loaders/Linux-IME
        env:
          KEYKEY_BUILD_DIR: out/build/ubuntu-24.04-ci
          KEYKEY_PACKAGE_ARTIFACT_DIR: out/e2e/ubuntu-24.04-package-ci
          KEYKEY_RUN_X11_E2E: ON
        run: |
          sudo --preserve-env=KEYKEY_BUILD_DIR,KEYKEY_PACKAGE_ARTIFACT_DIR,KEYKEY_RUN_X11_E2E \
            ci/test-debian-package-lifecycle.sh \
              out/packages/ubuntu-24.04-amd64/release-candidate \
              out/packages/ubuntu-24.04-amd64/upgrade-fixture

      - name: Upload X11 typing evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-ubuntu-24.04-fcitx5-x11-e2e-${{ github.sha }}
          path: Source/Loaders/Linux-IME/out/e2e/ubuntu-24.04-package-ci
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Ubuntu 24.04 Debian packages
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-ubuntu-24.04-debian-packages-${{ github.sha }}
          path: Source/Loaders/Linux-IME/out/packages/ubuntu-24.04-amd64/release-candidate
          if-no-files-found: error
          retention-days: 7

  publish-linux:
    needs: [ubuntu-24-04-fcitx5-build, ubuntu-22-04-minimum-api]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    name: Publish Ubuntu 24.04 packages to the GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write

    steps:
      - name: Check out selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download verified Ubuntu 24.04 packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-ubuntu-24.04-debian-packages-${{ github.sha }}
          path: ${{ runner.temp }}/linux-packages

      - name: Verify version, package set, and checksums
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -nE '1s/^.* ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' README.md)
          linux_version=$(sed -nE 's/^project\(KeyKeyLinux VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES.*$/\1/p' Source/Loaders/Linux-IME/CMakeLists.txt)
          if [[ -z "$version" || "$linux_version" != "$version" || "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "The tag, README, and Linux package version must match." >&2
            exit 1
          fi

          cd "$RUNNER_TEMP/linux-packages"
          data="chichi77-keykey-data_${version}-1+ubuntu24.04_all.deb"
          fcitx="fcitx5-chichi77-keykey_${version}-1+ubuntu24.04_amd64.deb"
          shopt -s nullglob
          panels=(gnome-shell-extension-keykey-kimpanel_*+ubuntu24.04_all.deb)
          if (( ${#panels[@]} != 1 )); then
            echo "Expected exactly one Ubuntu 24.04 GNOME panel package." >&2
            exit 1
          fi
          panel=${panels[0]}
          panel_source="${panel%_all.deb}_source.tar.gz"
          for file in "$data" "$fcitx" "$panel" "$panel_source" SHA256SUMS; do
            test -s "$file" || { echo "Missing or empty release asset: $file" >&2; exit 1; }
          done
          expected_checksums=$(printf './%s\n' "$data" "$fcitx" "$panel" "$panel_source" | LC_ALL=C sort)
          actual_checksums=$(awk '{ print $2 }' SHA256SUMS | LC_ALL=C sort)
          if [[ "$actual_checksums" != "$expected_checksums" ]]; then
            echo "SHA256SUMS must list exactly the four Linux release assets." >&2
            exit 1
          fi
          sha256sum --check --strict SHA256SUMS

          mkdir -p "$RUNNER_TEMP/linux-release-assets"
          cp -- "$data" "$fcitx" "$panel" "$panel_source" SHA256SUMS \
            "$RUNNER_TEMP/linux-release-assets/"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Add Linux packages to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          assets=("$RUNNER_TEMP"/linux-release-assets/*)
          for attempt in 1 2 3 4 5; do
            if release_query=$(gh release view "$GITHUB_REF_NAME" \
                --repo "$GITHUB_REPOSITORY" --json tagName 2>&1); then
              gh release upload "$GITHUB_REF_NAME" \
                --repo "$GITHUB_REPOSITORY" "${assets[@]}"
              exit 0
            fi
            if ! grep -qiE 'release not found|HTTP 404' <<< "$release_query"; then
              echo "Could not query release $GITHUB_REF_NAME: $release_query" >&2
              exit 1
            fi
            if gh release create "$GITHUB_REF_NAME" \
                --repo "$GITHUB_REPOSITORY" --verify-tag \
                --title "chichi77 KeyKey $VERSION" \
                --generate-notes "${assets[@]}"; then
              exit 0
            fi
            echo "Release creation attempt $attempt failed; retrying after checking for another publisher." >&2
            sleep 3
          done
          echo "Could not create or find release $GITHUB_REF_NAME." >&2
          exit 1

  ubuntu-22-04-minimum-api:
    if: github.event_name != 'pull_request'
    name: Full Ubuntu 22.04 minimum API build and package lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: ubuntu:22.04@sha256:829f6df217bcbae2b371026e81711d1a787c61b2967ad09d015063663ebafbf7

    steps:
      - name: Install checkout prerequisites
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates git

      - name: Check out selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install minimum native build dependencies
        run: |
          apt-get install --yes --no-install-recommends \
            binutils build-essential cmake debhelper dpkg-dev fakeroot g++ \
            libcanberra-dev libfcitx5core-dev libsqlite3-dev lintian ninja-build pkg-config python3

      - name: Build, test, and verify staged installation
        working-directory: Source/Loaders/Linux-IME
        env:
          KEYKEY_BUILD_DIR: out/build/ubuntu-22.04-ci
          KEYKEY_STAGE_DIR: out/stage/ubuntu-22.04-ci
        run: ci/build-and-test.sh

      - name: Test configure and GNU Make source builds
        working-directory: Source/Loaders/Linux-IME
        run: ci/test-configure-make.sh --source-directory-only

      - name: Rebuild the source archive without Git or cached builds
        working-directory: Source/Loaders/Linux-IME
        run: ci/test-source-archive.sh

      - name: Build Ubuntu 22.04 Debian packages
        working-directory: Source/Loaders/Linux-IME
        run: ci/build-debian-packages.sh ubuntu-22.04 release-candidate

      - name: Test package install, removal, and reinstall
        working-directory: Source/Loaders/Linux-IME
        env:
          KEYKEY_PACKAGE_ARTIFACT_DIR: out/e2e/ubuntu-22.04-package-ci
        run: |
          ci/test-debian-package-lifecycle.sh \
            out/packages/ubuntu-22.04-amd64/release-candidate

      - name: Upload Ubuntu 22.04 package evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-ubuntu-22.04-debian-packages-${{ github.sha }}
          path: |
            Source/Loaders/Linux-IME/out/packages/ubuntu-22.04-amd64/release-candidate
            Source/Loaders/Linux-IME/out/e2e/ubuntu-22.04-package-ci
          if-no-files-found: warn
          retention-days: 7
