name: Package Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out selected revision
        uses: actions/checkout@v7

      - name: Resolve and verify version
        id: metadata
        run: |
          $title = Get-Content -LiteralPath README.md -Encoding UTF8 -TotalCount 1
          if ($title -notmatch '([0-9]+\.[0-9]+\.[0-9]+)$') {
              throw 'README.md does not end its title with an x.y.z version.'
          }
          $version = $Matches[1]

          $cmake = Get-Content -LiteralPath Source/Loaders/Windows-TSF/CMakeLists.txt -Raw -Encoding UTF8
          if ($cmake -notmatch "project\(KeyKeyWindowsTsf VERSION $([regex]::Escape($version)) LANGUAGES C CXX\)") {
              throw "CMakeLists.txt does not declare version $version."
          }
          $packager = Get-Content -LiteralPath Source/Loaders/Windows-TSF/Package-Windows.ps1 -Raw -Encoding UTF8
          if ($packager -notmatch "\[string\] \`$Version = '$([regex]::Escape($version))'") {
              throw "Package-Windows.ps1 does not default to version $version."
          }

          $shortSha = (git rev-parse --short=12 HEAD).Trim()
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "artifact_name=keykey-windows-$version-$shortSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Ensure only public dictionaries are present
        run: |
          if ((Test-Path -LiteralPath DataSource/chichi77Collection) -or
              (Test-Path -LiteralPath ../chichi77Collection)) {
              throw 'Private chichi77Collection data must not be included in public workflow artifacts.'
          }

      - name: Configure and build x64
        working-directory: Source/Loaders/Windows-TSF
        run: |
          cmake --preset windows-x64-vs2026 -DKEYKEY_CHICHI77_COLLECTION_DIR=
          cmake --build --preset windows-x64-vs2026-release

      - name: Test x64
        working-directory: Source/Loaders/Windows-TSF
        run: ctest --test-dir .\out\build\x64-vs2026 -C Release --output-on-failure

      - name: Configure and build x86
        working-directory: Source/Loaders/Windows-TSF
        run: |
          cmake --preset windows-x86 -DKEYKEY_CHICHI77_COLLECTION_DIR=
          cmake --build --preset windows-x86-release --target KeyKeyTsf

      - name: Build unsigned installer archive
        working-directory: Source/Loaders/Windows-TSF
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./Package-Windows.ps1 `
            -BuildDirectory ./out/build/x64-vs2026 `
            -X86BuildDirectory ./out/build/x86 `
            -Version $env:VERSION

      - name: Stage artifact and checksum
        run: |
          $artifactDirectory = New-Item -ItemType Directory -Path artifacts -Force
          $source = "Source/Loaders/Windows-TSF/out/package/chichi77-KeyKey-$env:VERSION-windows-x64.zip"
          $destination = Join-Path $artifactDirectory.FullName (Split-Path -Leaf $source)
          Copy-Item -LiteralPath $source -Destination $destination
          $hash = (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $destination)" |
            Set-Content -LiteralPath "$destination.sha256" -Encoding ascii

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
