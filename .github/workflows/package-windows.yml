name: Windows Build and Unsigned Inputs

on:
  push:
    branches: [master, 'codex/beta*-update-feeds']
    paths:
      - 'Source/Loaders/Windows-TSF/**'
      - 'Source/Guanyinma/**'
      - 'Source/Frameworks/**'
      - 'Source/ModulePackages/**'
      - 'Source/ExternalLibraries/**'
      - 'Source/Shared/**'
      - 'Source/Branding/**'
      - 'Source/Distributions/Takao/CookedDatabase/KeyKey.db'
      - 'Source/Distributions/Takao/DatabaseCooker/verify-smart-mandarin-db.py'
      - 'Source/Distributions/Takao/DatabaseCooker/smart_mandarin_model.py'
      - 'Source/Distributions/Takao/DatabaseCooker/cin_reading_frequencies.py'
      - 'Source/Distributions/Takao/DatabaseCooker/phrase_unigram_supplement.py'
      - 'Source/Distributions/Takao/OnlineData/CannedMessages.plist'
      - 'Source/Loaders/iOS-Keyboard/KeyKeyEngine/Sources/KeyKeyEngine/KeyboardInput.swift'
      - '.github/scripts/*windows_signing*'
      - '.github/scripts/windows-signing.py'
      - '.github/workflows/package-windows.yml'
      - '.github/workflows/mirror-windows-signed.yml'
      - 'update/prepare.py'
      - 'update/channels.py'
      - 'update/metadata.py'
      - 'update/config.json'
      - 'update/dependencies.json'
      - 'update/test_channels.py'
      - 'update/test_metadata.py'
      - 'update/verify-windows.ps1'
      - 'update/test_verify_windows.ps1'
      - '!**/*.md'
      - '!**/README*'
      - '!**/LICENSE*'
      - '!**/docs/**'
      - '.gitattributes'
  pull_request:
    paths:
      - 'Source/Loaders/Windows-TSF/**'
      - 'Source/Guanyinma/**'
      - 'Source/Frameworks/**'
      - 'Source/ModulePackages/**'
      - 'Source/ExternalLibraries/**'
      - 'Source/Shared/**'
      - 'Source/Branding/**'
      - 'Source/Distributions/Takao/CookedDatabase/KeyKey.db'
      - 'Source/Distributions/Takao/DatabaseCooker/verify-smart-mandarin-db.py'
      - 'Source/Distributions/Takao/DatabaseCooker/smart_mandarin_model.py'
      - 'Source/Distributions/Takao/DatabaseCooker/cin_reading_frequencies.py'
      - 'Source/Distributions/Takao/DatabaseCooker/phrase_unigram_supplement.py'
      - 'Source/Distributions/Takao/OnlineData/CannedMessages.plist'
      - 'Source/Loaders/iOS-Keyboard/KeyKeyEngine/Sources/KeyKeyEngine/KeyboardInput.swift'
      - '.github/scripts/*windows_signing*'
      - '.github/scripts/windows-signing.py'
      - '.github/workflows/package-windows.yml'
      - '.github/workflows/mirror-windows-signed.yml'
      - 'update/prepare.py'
      - 'update/channels.py'
      - 'update/metadata.py'
      - 'update/config.json'
      - 'update/dependencies.json'
      - 'update/test_channels.py'
      - 'update/test_metadata.py'
      - 'update/verify-windows.ps1'
      - 'update/test_verify_windows.ps1'
      - '!**/*.md'
      - '!**/README*'
      - '!**/LICENSE*'
      - '!**/docs/**'
      - '.gitattributes'
  workflow_dispatch:
    inputs:
      checks:
        description: 'package = original build/test/unsigned inputs; focused modes retain native checks'
        type: choice
        options: [package, shared-data, signing, updater]
        default: package
      release_tag:
        description: 'Optional vX.Y.Z-betaN build label; blank uses the CMake stable version. No Release is required.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: windows-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      KEYKEY_TEST_REQUIRE_SHORT_PATHS: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Read the committed Rust toolchain
        id: rust
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('Source/Guanyinma/rust-toolchain.toml', 'rb'))['toolchain']['channel'])"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read Rust toolchain.' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          targets: x86_64-pc-windows-msvc,i686-pc-windows-msvc
      - name: Install NSIS packaging dependency
        if: ${{ (inputs.checks == '' || inputs.checks == 'package') && (github.event_name != 'push' || github.ref == 'refs/heads/master') }}
        run: choco install nsis --version=3.12.0 --yes --no-progress --limit-output
      - name: Shared PowerShell build, tests and unsigned packaging
        id: build
        if: ${{ (inputs.checks == '' || inputs.checks == 'package') && (github.event_name != 'push' || github.ref == 'refs/heads/master') }}
        env:
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          ./Source/Loaders/Windows-TSF/Build-WindowsRelease.ps1 `
            -OutputDirectory "$env:RUNNER_TEMP/keykey-windows-checks" -Python python `
            -ReleaseTag "$env:REQUESTED_RELEASE_TAG" `
            -MakensisPath "${env:ProgramFiles(x86)}/NSIS/makensis.exe"
      # The full build already runs these pairings with short paths required.
      # A focused dispatch (or a failed build) can still collect this suite's result.
      - name: Build shared data test targets
        if: ${{ !cancelled() && (inputs.checks == 'shared-data' || ((inputs.checks == '' || inputs.checks == 'package') && github.event_name != 'push' && steps.build.outcome != 'success')) }}
        working-directory: Source/Loaders/Windows-TSF
        run: |
          python ../../../update/prepare.py fetch windows
          if ($LASTEXITCODE -ne 0) { throw 'Updater SDK preparation failed.' }
          cmake --preset windows-x64-vs2026
          if ($LASTEXITCODE -ne 0) { throw 'x64 configure failed.' }
          cmake --build --preset windows-x64-vs2026-release --target KeyKeySharedDataProtectionTest
          if ($LASTEXITCODE -ne 0) { throw 'x64 test build failed.' }
          cmake --preset windows-x86
          if ($LASTEXITCODE -ne 0) { throw 'x86 configure failed.' }
          cmake --build --preset windows-x86-release --target KeyKeySharedDataProtectionTest
          if ($LASTEXITCODE -ne 0) { throw 'x86 test build failed.' }
          dotnet run --project SettingsModern.Tests/SettingsModern.Tests.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Managed settings tests failed.' }
      - name: Test native and managed shared data pairings
        if: ${{ !cancelled() && (inputs.checks == 'shared-data' || ((inputs.checks == '' || inputs.checks == 'package') && github.event_name != 'push' && steps.build.outcome != 'success')) }}
        working-directory: Source/Loaders/Windows-TSF
        run: |
          $x64 = (Resolve-Path './out/build/x64-vs2026/Release/KeyKeySharedDataProtectionTest.exe').Path
          $x86 = (Resolve-Path './out/build/x86/Release/KeyKeySharedDataProtectionTest.exe').Path
          & $x64 $x86
          if ($LASTEXITCODE -ne 0) { throw 'x64 to x86 shared data test failed.' }
          & $x86 $x64
          if ($LASTEXITCODE -ne 0) { throw 'x86 to x64 shared data test failed.' }
          $managed = (Resolve-Path './SettingsModern.Tests/bin/Release/net10.0/SettingsModern.Tests.dll').Path
          $dotnet = (Get-Command dotnet).Source
          foreach ($native in @($x64, $x86)) {
            & $native --managed $dotnet $managed
            if ($LASTEXITCODE -ne 0) { throw 'Native and managed shared data test failed.' }
          }
      - name: Test provenance, transport, immutable publication and mirror gates
        if: ${{ !cancelled() && inputs.checks != 'shared-data' && inputs.checks != 'updater' && steps.build.outcome != 'success' }}
        run: |
          python -m unittest discover -s .github/scripts -p test_windows_signing.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows release transport regression failed.' }
      - name: Test packaging without certificates or external services (Windows PowerShell)
        if: ${{ !cancelled() && inputs.checks != 'shared-data' && inputs.checks != 'updater' && steps.build.outcome != 'success' }}
        shell: powershell
        run: ./Source/Loaders/Windows-TSF/Packaging/Test-Signing.ps1
      - name: Test packaging without certificates or external services (PowerShell 7)
        if: ${{ !cancelled() && inputs.checks != 'shared-data' && inputs.checks != 'updater' }}
        run: ./Source/Loaders/Windows-TSF/Packaging/Test-Signing.ps1
      - name: Test x64 managed updater and native WinSparkle beta comparisons
        if: ${{ !cancelled() && inputs.checks != 'shared-data' && inputs.checks != 'signing' }}
        run: |
          python update/prepare.py fetch windows
          if ($LASTEXITCODE -ne 0) { throw 'Updater SDK preparation failed.' }
          $openssl = Join-Path $env:ProgramFiles 'Git/usr/bin/openssl.exe'
          dotnet run --project Source/Loaders/Windows-TSF/DesktopUpdater.Tests/DesktopUpdater.Tests.csproj `
            --configuration Release -r win-x64 --self-contained -- --native --openssl $openssl
          if ($LASTEXITCODE -ne 0) { throw 'Updater beta regressions failed.' }
      - name: Test x86 managed channel selection without rebuilding TSF
        if: ${{ !cancelled() && inputs.checks != 'shared-data' && inputs.checks != 'signing' }}
        run: |
          dotnet run --project Source/Loaders/Windows-TSF/DesktopUpdater.Tests/DesktopUpdater.Tests.csproj `
            --configuration Release -r win-x86 --self-contained
          if ($LASTEXITCODE -ne 0) { throw 'x86 channel selection regressions failed.' }
      - name: Build Settings with the isolated beta configuration resource
        if: ${{ !cancelled() && inputs.checks != 'shared-data' && inputs.checks != 'signing' }}
        run: |
          . ./Source/Loaders/Windows-TSF/Packaging/Get-ProductVersion.ps1
          $version = Get-KeyKeyProductVersion
          $config = Join-Path $env:RUNNER_TEMP 'keykey-beta-build-config.json'
          python update/prepare.py select-release --tag "v$version-beta1" --version $version --out $config
          if ($LASTEXITCODE -ne 0) { throw 'Beta configuration selection failed.' }
          $env:KEYKEY_UPDATE_CONFIG = $config
          dotnet build Source/Loaders/Windows-TSF/SettingsModern/KeyKeySettings.csproj --configuration Release -r win-x64 --artifacts-path "$env:RUNNER_TEMP/keykey-beta-settings"
          if ($LASTEXITCODE -ne 0) { throw 'Settings beta resource build failed.' }
      - name: Save unsigned inputs for local signing (no public release assets)
        if: github.repository == 'polobread/KeyKey' && github.event_name != 'pull_request' && steps.build.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keykey-windows-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/keykey-windows-checks/artifact/
          if-no-files-found: error
          retention-days: 30
