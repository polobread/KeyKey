name: Windows Checks

on:
  push:
    branches: [master]
    paths: ['Source/**', 'DataSource/**', 'update/**', '.github/scripts/**', '.github/workflows/package-windows.yml']
  pull_request:
    branches: [master]
    paths: ['Source/**', 'DataSource/**', 'update/**', '.github/scripts/**', '.github/workflows/package-windows.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and validate x64 and x86 (no signing, release artifacts or publication)
        run: |
          ./Source/Loaders/Windows-TSF/Build-WindowsRelease.ps1 -OutputDirectory "$env:RUNNER_TEMP/keykey-windows-checks" -Python python
