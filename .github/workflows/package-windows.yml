name: Package Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing version tag to publish, for example v1.2.3; leave blank for artifact only'
        required: false
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve and verify version
        id: metadata
        env:
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $title = Get-Content -LiteralPath README.md -Encoding UTF8 -TotalCount 1
          if ($title -notmatch '([0-9]+\.[0-9]+\.[0-9]+)$') {
              throw 'README.md does not end its title with an x.y.z version.'
          }
          $version = $Matches[1]

          $cmake = Get-Content -LiteralPath Source/Loaders/Windows-TSF/CMakeLists.txt -Raw -Encoding UTF8
          if ($cmake -notmatch "project\(KeyKeyWindowsTsf VERSION $([regex]::Escape($version)) LANGUAGES C CXX\)") {
              throw "CMakeLists.txt does not declare version $version."
          }
          $packager = Get-Content -LiteralPath Source/Loaders/Windows-TSF/Package-Windows.ps1 -Raw -Encoding UTF8
          if ($packager -notmatch "\[string\] \`$Version = '$([regex]::Escape($version))'") {
              throw "Package-Windows.ps1 does not default to version $version."
          }

          $expectedTag = "v$version"
          $releaseTag = ''
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
              $releaseTag = $env:GITHUB_REF_NAME
          }
          elseif (-not [string]::IsNullOrWhiteSpace($env:REQUESTED_RELEASE_TAG)) {
              $releaseTag = $env:REQUESTED_RELEASE_TAG.Trim()
          }
          if ($releaseTag -and $releaseTag -ne $expectedTag) {
              throw "Release tag must be $expectedTag, but received $releaseTag."
          }

          $shortSha = (git rev-parse --short=12 HEAD).Trim()
          $publishRelease = if ($releaseTag) { 'true' } else { 'false' }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "artifact_name=keykey-windows-$version-$shortSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "publish_release=$publishRelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release_tag=$releaseTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure and build x64
        working-directory: Source/Loaders/Windows-TSF
        run: |
          cmake --preset windows-x64-vs2026
          cmake --build --preset windows-x64-vs2026-release

      - name: Test x64
        working-directory: Source/Loaders/Windows-TSF
        run: ctest --test-dir .\out\build\x64-vs2026 -C Release --output-on-failure

      - name: Configure and build x86
        working-directory: Source/Loaders/Windows-TSF
        run: |
          cmake --preset windows-x86
          cmake --build --preset windows-x86-release --target KeyKeyTsf

      - name: Install NSIS 3.12
        run: |
          choco install nsis --version=3.12.0 --yes --no-progress --limit-output
          $makensis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          if (-not (Test-Path -LiteralPath $makensis -PathType Leaf)) {
              throw "makensis.exe was not installed at $makensis"
          }
          $reportedVersion = (& $makensis /VERSION 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $reportedVersion -notmatch '^v?3\.12(?:\D|$)') {
              throw "Expected NSIS 3.12, found: $reportedVersion"
          }
          "MAKENSIS_PATH=$makensis" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build unsigned installer archive
        working-directory: Source/Loaders/Windows-TSF
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./Package-Windows.ps1 `
            -BuildDirectory ./out/build/x64-vs2026 `
            -X86BuildDirectory ./out/build/x86 `
            -Version $env:VERSION

      - name: Build unsigned NSIS installer
        working-directory: Source/Loaders/Windows-TSF
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File ./Package-Store-Windows.ps1 `
            -BuildDirectory ./out/build/x64-vs2026 `
            -X86BuildDirectory ./out/build/x86 `
            -Version $env:VERSION `
            -MakensisPath $env:MAKENSIS_PATH `
            -UnsignedTest

      - name: Stage artifact and checksum
        run: |
          $artifactDirectory = New-Item -ItemType Directory -Path artifacts -Force
          $sources = @(
            "Source/Loaders/Windows-TSF/out/package/chichi77-KeyKey-$env:VERSION-windows-x64.zip",
            "Source/Loaders/Windows-TSF/out/store-package/chichi77-KeyKey-$env:VERSION-windows-x64-setup.unsigned.exe"
          )
          foreach ($source in $sources) {
              $destination = Join-Path $artifactDirectory.FullName (Split-Path -Leaf $source)
              Copy-Item -LiteralPath $source -Destination $destination
              $hash = (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $(Split-Path -Leaf $destination)" |
                Set-Content -LiteralPath "$destination.sha256" -Encoding ascii
          }

      - name: Upload packaged artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Publish unsigned GitHub Release
        if: steps.metadata.outputs.publish_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.release_tag }}
        run: |
          if ($null -eq (Get-Command gh -ErrorAction SilentlyContinue)) {
            choco install gh --yes --no-progress --limit-output
          }
          & gh --version
          $assets = @(
            "artifacts/chichi77-KeyKey-$env:VERSION-windows-x64.zip",
            "artifacts/chichi77-KeyKey-$env:VERSION-windows-x64.zip.sha256",
            "artifacts/chichi77-KeyKey-$env:VERSION-windows-x64-setup.unsigned.exe",
            "artifacts/chichi77-KeyKey-$env:VERSION-windows-x64-setup.unsigned.exe.sha256"
          )

          $releaseQuery = (& gh release view $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY --json tagName 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -eq 0) {
              & gh release upload $env:RELEASE_TAG `
                --repo $env:GITHUB_REPOSITORY @assets
              if ($LASTEXITCODE -ne 0) {
                  throw "Could not upload assets to existing release $env:RELEASE_TAG."
              }
          }
          elseif ($releaseQuery -match '(?i)(release not found|HTTP 404)') {
              & gh release create $env:RELEASE_TAG `
                --repo $env:GITHUB_REPOSITORY `
                --verify-tag `
                --title "chichi77 KeyKey $env:VERSION" `
                --generate-notes @assets
              if ($LASTEXITCODE -ne 0) {
                  throw "Could not create release $env:RELEASE_TAG."
              }
          }
          else {
              throw "Could not query release $env:RELEASE_TAG`: $releaseQuery"
          }
